<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#130c0e">
<title>ObraCheck</title>
<style id="app-style">
  :root {
    /* paleta oficial Emais — institucionais: Verde #18b68c, Verde Água #4ed8b0,
       Verde Escuro 1 #1e756a, Verde Escuro 2 #2d8c7e, Verde Acinzentado 1 #2f4858,
       Verde Acinzentado 2 #415e6d, Gelo #e0e9fc, Branco #f3f7ff, Preto #130c0e.
       Apoio (uso comedido, per manual de marca): Magenta #e01451, Rosa #f24e8c. */
    --ink: #130c0e;
    --bg: #e0e9fc;
    --surface: #ffffff;
    --surface-2: #dcefe8;
    --border: #c3d6cd;
    --text: #130c0e;
    --text-muted: #415e6d;
    --accent: #18b68c;
    --accent-strong: #1e756a;
    --accent-ink: #ffffff;
    --ok: #1e756a;
    --ok-bg: #dcf3ea;
    --ok-border: #a9dfc9;
    --nc: #e01451;
    --nc-bg: #fce3ec;
    --nc-border: #f5b8ce;
    --na: #415e6d;
    --na-bg: #e4e9e6;
    --na-border: #c9d2cd;
    --focus: #18b68c;
    --shadow: 0 1px 2px rgba(19,12,14,0.07), 0 6px 20px -8px rgba(19,12,14,0.18);
    --tri-a: #1e756a;
    --tri-b: #2d8c7e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #0a0706;
      --bg: #10201b;
      --surface: #16241f;
      --surface-2: #1c2e27;
      --border: #2c453b;
      --text: #eaf3ee;
      --text-muted: #9fc2b3;
      --accent: #4ed8b0;
      --accent-strong: #6fe3c0;
      --accent-ink: #0a1310;
      --ok: #4ed8b0;
      --ok-bg: #12332a;
      --ok-border: #2f6b58;
      --nc: #ff6fa0;
      --nc-bg: #3a1226;
      --nc-border: #6b2246;
      --na: #9fb3ac;
      --na-bg: #1f2b27;
      --na-border: #33453e;
      --focus: #4ed8b0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.55);
      --tri-a: #2d8c7e;
      --tri-b: #1e756a;
    }
  }
  :root[data-theme="dark"] {
    --ink: #0a0706;
    --bg: #10201b;
    --surface: #16241f;
    --surface-2: #1c2e27;
    --border: #2c453b;
    --text: #eaf3ee;
    --text-muted: #9fc2b3;
    --accent: #4ed8b0;
    --accent-strong: #6fe3c0;
    --accent-ink: #0a1310;
    --ok: #4ed8b0;
    --ok-bg: #12332a;
    --ok-border: #2f6b58;
    --nc: #ff6fa0;
    --nc-bg: #3a1226;
    --nc-border: #6b2246;
    --na: #9fb3ac;
    --na-bg: #1f2b27;
    --na-border: #33453e;
    --focus: #4ed8b0;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.55);
    --tri-a: #2d8c7e;
    --tri-b: #1e756a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; text-wrap: balance; margin: 0; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  a { color: var(--accent); }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }

  .app-shell { min-height: 100%; padding-bottom: 48px; }

  .topbar { background: var(--ink); color: #EAF3EE; position: relative; }
  .tri-strip {
    height: 7px;
    background-color: var(--tri-a);
    background-image:
      linear-gradient(45deg, var(--tri-b) 25%, transparent 25%) -8px 0,
      linear-gradient(-45deg, var(--tri-b) 25%, transparent 25%) -8px 0,
      linear-gradient(45deg, transparent 75%, var(--tri-b) 75%),
      linear-gradient(-45deg, transparent 75%, var(--tri-b) 75%);
    background-size: 16px 16px;
  }
  .topbar-inner { max-width: 960px; margin: 0 auto; padding: 14px 20px 10px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo-chip { background: #ffffff; border-radius: 8px; padding: 5px 10px; display: flex; align-items: center; line-height: 0; }
  .brand-logo-chip img { height: 22px; width: auto; display: block; }
  .brand-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.02em; color: #EAF3EE; }
  .brand-name small { display: block; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); margin-top: 1px; }
  .info-banner { max-width: 960px; margin: 0 auto; padding: 7px 20px 11px; font-size: 12.5px; color: #9fc2b3; }

  .tab-bar { max-width: 960px; margin: 0 auto; padding: 0 20px 14px; display: flex; gap: 8px; }
  .tab-btn {
    appearance: none; border: 1.5px solid rgba(255,255,255,0.22); background: transparent; color: #cfe7df;
    border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .tab-btn.is-active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .container { max-width: 960px; margin: 0 auto; padding: 22px 20px 60px; display: flex; flex-direction: column; gap: 18px; }

  /* ===== Alojamentos ===== */
  .score-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
    font-weight: 700; font-size: 14px; border: 1.5px solid var(--border); background: var(--bg); margin-bottom: 16px;
  }
  .score-badge .score-num { font-family: 'IBM Plex Mono', monospace; font-size: 15px; }
  .score-badge.is-otimo, .score-badge.is-bom { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .score-badge.is-regular { background: #FCEFD8; border-color: #f0d6a0; color: #8a5a10; }
  .score-badge.is-ruim, .score-badge.is-pessimo { background: var(--nc-bg); border-color: var(--nc-border); color: var(--nc); }
  .score-badge.is-vazio { color: var(--text-muted); }

  .aloj-item {
    display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 10px;
  }
  .aloj-item.is-nao { border-color: var(--nc-border); background: var(--nc-bg); }
  .aloj-item.is-sim { border-color: var(--ok-border); }
  .aloj-item-top { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px; }
  .aloj-item-extra { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .aloj-item-extra[hidden] { display: none; }

  .dyn-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
  .dyn-row { padding: 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; }
  .dyn-row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .dyn-row-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .dyn-remove-btn {
    appearance: none; border: 1.5px solid var(--border); background: var(--surface); color: var(--nc);
    border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; flex: none;
  }

  .termo-text { font-size: 13px; color: var(--text); line-height: 1.5; max-height: 360px; overflow-y: auto; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
  .termo-text h3 { font-size: 13.5px; margin: 14px 0 6px; }
  .termo-text h3:first-child { margin-top: 0; }
  .termo-text ul { margin: 0 0 4px; padding-left: 20px; }
  .termo-text li { margin-bottom: 4px; }
  .termo-text p { margin: 0 0 8px; }

  .aloj-menu-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .aloj-menu-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
  }

  /* ===== Dashboard ===== */
  .dash-filters { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
  .dash-filters .field { min-width: 180px; flex: 1; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-tile {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-tile-label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-tile-value { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; line-height: 1.1; }
  .stat-tile-value.is-good { color: var(--ok); }
  .stat-tile-value.is-warning { color: #8a5a10; }
  .stat-tile-value.is-critical { color: var(--nc); }
  .stat-tile-sub { font-size: 12px; color: var(--text-muted); }
  .dash-section { margin-bottom: 26px; }
  .dash-section:last-child { margin-bottom: 0; }
  .dash-section-title { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
  .dash-section-hint { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; }
  .rank-list { display: flex; flex-direction: column; gap: 14px; }
  .rank-row { display: flex; flex-direction: column; gap: 4px; }
  .rank-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .rank-label { font-size: 13.5px; color: var(--text); flex: 1; }
  .rank-value { font-size: 13px; color: var(--text-muted); flex: none; }
  .rank-bar-wrap { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .rank-bar { height: 100%; border-radius: 999px; }
  .rank-sub { font-size: 11.5px; color: var(--text-muted); }
  .dash-pending-list { display: flex; flex-direction: column; gap: 8px; }
  .dash-pending-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; font-size: 13.5px;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
  .card-title { font-size: 20px; margin-bottom: 16px; }
  .card-eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 6px;
  }

  .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select, .field textarea {
    font: inherit; font-size: 16px; background: var(--bg); border: 1.5px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 12px 12px; min-height: 48px;
  }
  .field textarea { min-height: 84px; resize: vertical; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

  .btn {
    appearance: none; border: none; cursor: pointer; border-radius: 10px; font-weight: 600; font-size: 15.5px;
    padding: 13px 22px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.06s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:not(:disabled):hover { background: var(--accent-strong); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }
  .btn-secondary:not(:disabled):hover { background: var(--border); }
  .btn-ghost { background: transparent; color: var(--accent); padding: 8px 10px; min-height: 38px; font-size: 14px; }
  .btn-ghost:hover { text-decoration: underline; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .plate {
    background: var(--surface-2); border: 1px solid var(--border); border-left: 5px solid var(--accent);
    border-radius: 10px; padding: 14px 16px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; margin-bottom: 18px;
  }
  .plate-item span { display: block; }
  .plate-item .plate-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 600; }
  .plate-item .plate-value { font-size: 15px; font-weight: 600; }

  .machine-photo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .machine-photo-row img {
    width: 96px; height: 72px; object-fit: contain; background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 6px; flex: none;
  }
  .machine-photo-row .machine-photo-caption { font-size: 13px; color: var(--text-muted); }
  .machine-photo-row .machine-photo-caption strong { color: var(--text); display: block; font-size: 14.5px; margin-bottom: 2px; }

  .epi-box {
    background: var(--bg); border: 1px dashed var(--border); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 18px; font-size: 13.5px; color: var(--text-muted);
  }
  .epi-box strong { color: var(--text); }
  .epi-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .epi-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--text); }

  .day-chips-wrap { margin-bottom: 18px; }
  .day-chips-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; display: block; }
  .day-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .day-chip {
    flex: none; width: 46px; height: 50px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer; color: var(--text-muted); font-weight: 700; font-size: 13.5px;
  }
  .day-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .day-chip[data-status="ok"] .dot { background: var(--ok); }
  .day-chip[data-status="nc"] .dot { background: var(--nc); }
  .day-chip[data-status="partial"] .dot { background: #E0A93F; }
  .day-chip.is-today { border-color: var(--accent); }
  .day-chip.is-selected { background: var(--surface-2); border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 2px var(--accent) inset; }

  .items-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .item-row {
    display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
  }
  .item-row.is-nc { border-color: var(--nc-border); background: var(--nc-bg); }
  .item-row.is-ok { border-color: var(--ok-border); }
  .item-num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text-muted); text-align: center; }
  .item-desc { font-size: 14.5px; margin: 0; }
  .status-group { display: flex; gap: 6px; flex: none; }
  .status-btn {
    appearance: none; cursor: pointer; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-muted); font-weight: 700; font-size: 12.5px; padding: 10px 12px; min-height: 44px; min-width: 44px; letter-spacing: 0.02em;
  }
  .status-btn[data-status="ok"].active { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .status-btn[data-status="nc"].active { background: var(--nc-bg); border-color: var(--nc); color: var(--nc); }
  .status-btn[data-status="na"].active { background: var(--na-bg); border-color: var(--na); color: var(--na); }
  .status-btn[data-status="sim"].active { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .status-btn[data-status="nao"].active { background: var(--nc-bg); border-color: var(--nc); color: var(--nc); }

  .nc-note[hidden], .sig-section[hidden] { display: none; }
  .nc-note { margin-bottom: 18px; }

  .sig-section { margin-bottom: 18px; }
  .sig-block { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
  .sig-block > span { font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .sig-pad-wrap { background: #FFFFFF; border: 1.5px dashed var(--border); border-radius: 10px; position: relative; touch-action: none; overflow: hidden; }
  .sig-pad-wrap canvas { display: block; width: 100%; height: 150px; touch-action: none; }
  .sig-hint { position: absolute; bottom: 8px; left: 12px; color: #B9B2A0; font-size: 12px; pointer-events: none; }
  .sig-hint.hidden { display: none; }

  .foto-section[hidden] { display: none; }
  .foto-section { margin-bottom: 18px; }
  .foto-section > span { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .foto-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .foto-thumb { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--border); background: var(--surface); flex: none; }
  .foto-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-thumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: none; background: rgba(19,12,14,0.72); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .foto-add-btn { appearance: none; border: 1.5px dashed var(--border); background: var(--bg); color: var(--text); border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .foto-add-btn:active { transform: translateY(1px); }

  .closing-section { margin-top: 6px; padding-top: 20px; border-top: 1.5px dashed var(--border); }
  .closing-section .card-eyebrow { margin-bottom: 4px; }
  .closing-hint { font-size: 13px; color: var(--text-muted); margin: 0 0 16px; max-width: 640px; }
  .closing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; margin-bottom: 16px; }
  .closing-col { display: flex; flex-direction: column; gap: 12px; }
  .closing-status { font-size: 13.5px; color: var(--ok); font-weight: 600; margin-top: 4px; }
  .closing-status.is-pending { color: var(--text-muted); font-weight: 500; }

  .form-errors {
    background: var(--nc-bg); border: 1px solid var(--nc-border); color: var(--nc);
    border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px;
  }
  .form-errors ul { margin: 4px 0 0; padding-left: 18px; }
  .form-errors[hidden] { display: none; }

  .selection-card .btn { margin-top: 4px; }

  .sheet-toolbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .sheet-toolbar-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

  .history-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .history-row {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
  }
  .history-main { display: flex; flex-direction: column; gap: 2px; }
  .history-main strong { font-size: 15px; }
  .history-sub { font-size: 12.5px; color: var(--text-muted); }
  .history-fech { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .history-fech.is-ok { color: var(--ok); }
  .history-fech.is-pending { color: var(--text-muted); font-weight: 500; }
  .history-stats { display: flex; gap: 6px; flex-wrap: wrap; }
  .history-pill { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .history-pill.is-ok { background: var(--ok-bg); color: var(--ok); }
  .history-pill.is-nc { background: var(--nc-bg); color: var(--nc); }
  .history-pill.is-partial { background: #FCEFD8; color: #8a5a10; }
  .history-pill.is-empty { background: var(--na-bg); color: var(--na); }
  @media (max-width: 560px) {
    .history-row { grid-template-columns: 1fr; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
    background: var(--ink); color: #F2ECDD; border: 1px solid var(--accent);
    padding: 12px 18px; border-radius: 10px; font-size: 14px; max-width: 92vw;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast-error { border-color: var(--nc); }

  .download-bar {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 0);
    background: var(--ink); color: #F2ECDD; border: 1.5px solid var(--accent);
    padding: 12px 14px; border-radius: 12px; font-size: 14px; max-width: 92vw;
    box-shadow: var(--shadow); z-index: 41; display: flex; align-items: center; gap: 10px;
  }
  .download-bar a { color: var(--accent); font-weight: 700; text-decoration: underline; word-break: break-word; }
  .download-bar button { appearance: none; border: none; background: transparent; color: #F2ECDD; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; flex: none; }

  .storage-warn {
    position: sticky; top: 0; z-index: 42; background: var(--nc-bg); color: var(--nc);
    border-bottom: 1.5px solid var(--nc-border); padding: 10px 16px; font-size: 13px;
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
  }
  .storage-warn strong { color: inherit; }
  .storage-warn button { appearance: none; border: none; background: transparent; color: var(--nc); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px; flex: none; }

  @media (max-width: 560px) {
    .item-row { grid-template-columns: 24px 1fr; }
    .status-group { grid-column: 1 / -1; justify-content: flex-start; }
  }
</style>

    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();

  var SUPABASE_URL = "https://ivggmzmlxsxtobpunutq.supabase.co";

  function pushRecordToCloud(key, record) {
    var row = {
      record_key: key,
      obra: record.obra,
      maquina_tipo_key: record.maquinaTipoKey,
      maquina_id: record.maquinaId || null,
      mes_ano: record.mesAno,
      data: record,
      updated_at: record._updatedAt
    };
    fetch(SUPABASE_URL + "/rest/v1/" + SUPABASE_TABLE + "?on_conflict=record_key", {
      method: "POST",
      headers: cloudHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([row])
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      setSyncStatus(true);
    }).catch(function () {
      setSyncStatus(false);
    });
  }

  // Salva localmente (igual antes) e também manda pra nuvem. É essa função
  // que os pontos do app que gravam um registro devem chamar, no lugar de
  // mexer em months[key]/saveMonths diretamente.
  function persistRecord(key, record, months) {
    record._updatedAt = new Date().toISOString();
    months[key] = record;
    saveMonths(months);
    pushRecordToCloud(key, record);
  }

  function pullAllFromCloud() {
    return fetch(SUPABASE_URL + "/rest/v1/" + SUPABASE_TABLE + "?select=record_key,data,updated_at", {
      headers: cloudHeaders()
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  // Roda uma vez ao abrir o app: busca tudo que está na nuvem, compara com
  // o que está salvo neste aparelho (pelo campo _updatedAt) e fica com a
  // versão mais recente de cada planilha. O que só existe neste aparelho
  // (feito offline, por exemplo) é enviado pra nuvem em seguida.
  function syncOnStartup() {
    pullAllFromCloud().then(function (rows) {
      var cloudByKey = {};
      rows.forEach(function (r) { cloudByKey[r.record_key] = r; });
      var months = loadMonths();
      var localChanged = false;
      Object.keys(cloudByKey).forEach(function (key) {
        var row = cloudByKey[key];
        var local = months[key];
        var cloudTime = row.updated_at ? new Date(row.updated_at).getTime() : 0;
        var localTime = local && local._updatedAt ? new Date(local._updatedAt).getTime() : -1;
        if (cloudTime >= localTime) { months[key] = row.data; localChanged = true; }
      });
      if (localChanged) saveMonths(months);
      Object.keys(months).forEach(function (key) {
        var row = cloudByKey[key];
        var local = months[key];
        var localTime = local._updatedAt ? new Date(local._updatedAt).getTime() : 0;
        var cloudTime = row && row.updated_at ? new Date(row.updated_at).getTime() : -1;
        if (!row || localTime > cloudTime) pushRecordToCloud(key, local);
      });
      setSyncStatus(true);
      if (sheet && months[sheet.key]) { sheet.record = months[sheet.key]; }
      render();
    }).catch(function () {
      setSyncStatus(false);
    });
  }

    return record.fechamento || { operadorNome: "", operadorAssinatura: null, tstNome: "", tstAssinatura: null, data: "" };

  function dayStatus(record, dia) {
    var d = record.dias[dia];
    if (!d) return "vazio";
    var hasNC = d.statuses.some(function (s) { return s === "nc"; });
    if (hasNC) return "nc";
    var allFilled = d.statuses.every(function (s) { return !!s; });
    return allFilled ? "ok" : "partial";
  }

  /* =========================================================
     HISTÓRICO DA MÁQUINA (por obra e máquina, em qualquer mês)
     O localStorage já guarda uma cópia de TODAS as planilhas da nuvem
     (ver syncOnStartup/pullAllFromCloud, sem filtro de obra), então o
     histórico de uma máquina fica disponível em qualquer aparelho,
     mesmo que o técnico de segurança tenha mudado de obra — sem
     depender de adivinhar em qual obra/mês a máquina foi cadastrada.
     ========================================================= */
  function summarizeRecord(record) {
    var dias = Object.keys(record.dias || {});
    var ok = 0, nc = 0, partial = 0;
    dias.forEach(function (d) {
      var st = dayStatus(record, d);
      if (st === "ok") ok++; else if (st === "nc") nc++; else if (st === "partial") partial++;
    });
    return { ok: ok, nc: nc, partial: partial, preenchidos: dias.length };
  }

  function machineHistoryEntries(tipo, maquinaId) {
    var months = loadMonths();
    var wantId = slug(maquinaId);
    var out = [];
    Object.keys(months).forEach(function (key) {
      var r = months[key];
      if (!r || r.maquinaTipoKey !== tipo) return;
      if (wantId && slug(r.maquinaId) !== wantId) return;
      out.push({ key: key, record: r });
    });
    out.sort(function (a, b) {
      if (a.record.mesAno !== b.record.mesAno) return a.record.mesAno < b.record.mesAno ? 1 : -1;
      return (a.record.obra || "").localeCompare(b.record.obra || "");
    });
    return out;
  }

  /* =========================================================

  function todayISODate() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function dateBr(iso) {
    if (!iso) return "—";
    var parts = String(iso).split("-");
    if (parts.length !== 3) return iso;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  // Regra de pontuação reproduzida da planilha NR-18: pontuação = nº SIM / nº itens
  // aplicáveis (SIM + NÃO; itens N/A não entram no denominador). Faixas de classificação
  // também vêm da planilha (aba Regra_Pontuação).
  function computeAlojScore(itens) {
    var sim = 0, aplicaveis = 0;
    (itens || []).forEach(function (it) {
      if (it.status === "sim") { sim++; aplicaveis++; }
      else if (it.status === "nao") { aplicaveis++; }
    });
    if (!aplicaveis) return { pontuacao: null, classificacao: null };
    var frac = sim / aplicaveis;
    var classificacao = frac <= 0.3 ? "Péssimo" : frac <= 0.5 ? "Ruim" : frac <= 0.7 ? "Regular" : frac < 1 ? "Bom" : "Ótimo";
    return { pontuacao: frac, classificacao: classificacao };
  }
  function classificacaoClass(classificacao) {
    if (classificacao === "Ótimo") return "otimo";
    if (classificacao === "Bom") return "bom";
    if (classificacao === "Regular") return "regular";
    if (classificacao === "Ruim") return "ruim";
    if (classificacao === "Péssimo") return "pessimo";
    return "vazio";
  }
  function scoreBadgeHtml(score) {
    var cls = classificacaoClass(score.classificacao);
    var pct = score.pontuacao != null ? Math.round(score.pontuacao * 100) + "%" : "—";
    return '<span class="score-badge is-' + cls + '" id="aloj-score-badge"><span class="score-num">' + pct + "</span> " + esc(score.classificacao || "Sem itens avaliados") + "</span>";
  }

  // Remove as fotos (pesadas, em base64) de uma cópia local de um registro de

  function stripAlojRecordForLocal(record) {
    var copy = JSON.parse(JSON.stringify(record));
    if (Array.isArray(copy.itens)) {
      copy.itens.forEach(function (item) { item.fotos = []; });
    }
    copy._fotosRemovidasLocalmente = true;
    return copy;
  }
  function fetchAlojChecklistFromCloud(key) {
    return fetch(SUPABASE_URL + "/rest/v1/" + ALOJ_TABLE + "?record_key=eq." + encodeURIComponent(key) + "&select=data", {
      headers: cloudHeaders()
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (rows) {
      return (rows && rows[0] && rows[0].data) ? rows[0].data : null;
    });
  }
  function alojChecklistKey(obra, alojamento, data) {
    return slug(obra) + "|" + slug(alojamento) + "|" + data;
  }
  function newAlojChecklistRecord(obra, alojamento, empresa, endereco, dataVistoria) {
    return {
      obra: obra,
      alojamento: alojamento,
      empresa: empresa || "",
      endereco: endereco || "",
      dataVistoria: dataVistoria,
      horario: "",
      quantidadeFuncionarios: "",
      itens: ALOJAMENTO_ITENS.map(function () { return { status: null, recomendacao: "", prazo: "", fotos: [] }; }),
      funcionarios: [],
      envolvidos: [],
      _updatedAt: null
    };
  }

  /* =========================================================
     ALOJAMENTOS — sincronização com a nuvem (Supabase)
     Mesma lógica da sincronização dos checklists de máquina (local-first,
     comparando _updatedAt), em tabela própria — para o técnico poder
     consultar vistorias de outros alojamentos/obras mesmo trocando de obra.
     ========================================================= */
  function pushAlojChecklistToCloud(key, record) {
    var score = computeAlojScore(record.itens);
    var row = {
      record_key: key,
      obra: record.obra,
      alojamento: record.alojamento,
      empresa: record.empresa || null,
      endereco: record.endereco || null,
      data_vistoria: record.dataVistoria,
      data: record,
      pontuacao: score.pontuacao,
      classificacao: score.classificacao,
      updated_at: record._updatedAt
    };
    return fetch(SUPABASE_URL + "/rest/v1/" + ALOJ_TABLE + "?on_conflict=record_key", {
      method: "POST",
      headers: cloudHeaders({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify([row])
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      setSyncStatus(true);
      return true;
    }).catch(function () {
      setSyncStatus(false);
      return false;
    });
  }
  // Salva localmente (com fotos, para funcionar offline/responsivo) e envia
  // para a nuvem. Só depois de confirmar que a nuvem recebeu os dados é que
  // trocamos a cópia local pela versão sem fotos — assim o espelho local
  // (que guarda as vistorias de TODAS as obras) não cresce sem limite, mas
  // nunca perdemos uma foto que ainda não foi confirmada na nuvem.
  function persistAlojChecklist(key, record) {
    record._updatedAt = new Date().toISOString();
    var all = loadAlojChecklists();
    all[key] = record;
    saveAlojChecklists(all);
    pushAlojChecklistToCloud(key, record).then(function (ok) {
      if (!ok) return;
      var current = loadAlojChecklists();
      if (!current[key] || current[key]._updatedAt !== record._updatedAt) return;
      current[key] = stripAlojRecordForLocal(record);
      saveAlojChecklists(current);
    });
  }
  function pullAllAlojChecklistsFromCloud() {
    return fetch(SUPABASE_URL + "/rest/v1/" + ALOJ_TABLE + "?select=record_key,data,updated_at", {
      headers: cloudHeaders()
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }
  function syncAlojChecklistsOnStartup() {
    pullAllAlojChecklistsFromCloud().then(function (rows) {
      var cloudByKey = {};
      rows.forEach(function (r) { cloudByKey[r.record_key] = r; });
      var all = loadAlojChecklists();
      var localChanged = false;
      Object.keys(cloudByKey).forEach(function (key) {
        var row = cloudByKey[key];
        var local = all[key];
        var cloudTime = row.updated_at ? new Date(row.updated_at).getTime() : 0;
        var localTime = local && local._updatedAt ? new Date(local._updatedAt).getTime() : -1;
        if (cloudTime >= localTime) {
          // Guarda localmente só a versão sem fotos (a nuvem já tem a
          // versão completa confirmada) — exceto a vistoria que está
          // aberta na tela agora, que precisa das fotos para continuar
          // sendo editada sem perder nada.
          var isOpenSheet = alojSheet && alojSheet.key === key;
          all[key] = isOpenSheet ? row.data : stripAlojRecordForLocal(row.data);
          localChanged = true;
        }
      });
      if (localChanged) saveAlojChecklists(all);
      Object.keys(all).forEach(function (key) {
        var row = cloudByKey[key];
        var local = all[key];
        var localTime = local._updatedAt ? new Date(local._updatedAt).getTime() : 0;
        var cloudTime = row && row.updated_at ? new Date(row.updated_at).getTime() : -1;
        if (!row || localTime > cloudTime) pushAlojChecklistToCloud(key, local);
      });
      setSyncStatus(true);
      if (alojSheet && cloudByKey[alojSheet.key]) alojSheet.record = cloudByKey[alojSheet.key].data;
      if (activeTab === "alojamentos") render();
    }).catch(function () {
      setSyncStatus(false);
    });
  }

  function alojChecklistHistoryEntries(obra, alojamento) {
    var all = loadAlojChecklists();
    var obraSlug = slug(obra), alojSlug = slug(alojamento);
    var list = [];
    Object.keys(all).forEach(function (key) {
      var r = all[key];
      if (slug(r.obra) === obraSlug && slug(r.alojamento) === alojSlug) list.push({ key: key, record: r });
    });
    list.sort(function (a, b) { return (b.record.dataVistoria || "").localeCompare(a.record.dataVistoria || ""); });
    return list;
  }

  // Depois de abrir a vistoria com os dados locais (que podem estar sem
  // fotos, se já tinham sido confirmados na nuvem antes), busca a versão
  // completa (com fotos) na nuvem em segundo plano e atualiza a tela — sem
  // bloquear a abertura, que precisa ser imediata.
  function hydrateAlojSheetFromCloud(key) {
    fetchAlojChecklistFromCloud(key).then(function (data) {
      if (!data) return;
      if (!alojSheet || alojSheet.key !== key) return; // usuário já saiu da tela
      alojSheet.record = data;
      if (activeTab === "alojamentos" && alojView === "checklist") render();
    }).catch(function () { /* mantém a cópia local; sem rede, segue offline */ });
  }
  function openAlojChecklist() {
    var obra = alojForm.obra;
    var alojamento = (alojForm.alojamento || "").trim();
    if (!alojamento) { toast("Informe o nome/identificação do alojamento.", "error"); return; }
    var dataVistoria = alojForm.dataVistoria || todayISODate();
    var key = alojChecklistKey(obra, alojamento, dataVistoria);
    var all = loadAlojChecklists();
    var isNew = !all[key];
    var record = all[key] || newAlojChecklistRecord(obra, alojamento, alojForm.empresa, alojForm.endereco, dataVistoria);
    alojSheet = { key: key, record: record };
    alojView = "checklist";
    render();
    if (!isNew) hydrateAlojSheetFromCloud(key);
  }
  function openAlojChecklistRecord(key) {
    var all = loadAlojChecklists();
    var record = all[key];
    if (!record) { toast("Vistoria não encontrada.", "error"); return; }
    alojSheet = { key: key, record: record };
    alojView = "checklist";
    render();
    hydrateAlojSheetFromCloud(key);
  }
  function openAlojTermo() {
    var alojamento = (alojForm.alojamento || "").trim();
    if (!alojamento) { toast("Informe o nome/identificação do alojamento.", "error"); return; }
    alojTermoDraft = newAlojTermoDraft(alojForm.obra, alojamento, alojForm.empresa);
    alojView = "termo";
    render();
  }

  // Seção de histórico isolada em sua própria função: precisa ser re-renderizada
  // a cada tecla digitada no campo "Alojamento" (sem refazer a tela inteira, o
  // que tiraria o foco do campo) para a lista de vistorias anteriores aparecer
  // enquanto o técnico ainda está digitando, e não só depois de trocar de obra.
  function renderAlojHistorySection() {
    var hasAloj = !!(alojForm.alojamento && alojForm.alojamento.trim());
    if (!hasAloj) {

    }
    var hist = alojChecklistHistoryEntries(alojForm.obra, alojForm.alojamento);
    if (!hist.length) {
      return '<p class="closing-status is-pending">Nenhuma vistoria registrada ainda para este alojamento.</p>';
    }
    var histRows = hist.map(function (e) {
      var score = computeAlojScore(e.record.itens);
      return (
        '<div class="aloj-menu-row">' +
        '<div><strong>' + esc(dateBr(e.record.dataVistoria)) + '</strong>' +
        '<span class="history-sub">' + esc(e.record.obra) + (e.record.empresa ? " · " + esc(e.record.empresa) : "") + "</span></div>" +
        scoreBadgeHtml(score).replace(' id="aloj-score-badge"', "") +
        '<button type="button" class="btn btn-secondary aloj-hist-open" data-key="' + esc(e.key) + '">Abrir</button>' +
        "</div>"
      );
    }).join("");
    return '<div class="aloj-menu-list">' + histRows + "</div>";
  }

      '<label class="field"><span>Endereço (opcional)</span><input type="text" id="aloj-sel-endereco" placeholder="Endereço" value="' + esc(alojForm.endereco) + '"></label>' +
      '<label class="field"><span>Data da vistoria</span><input type="date" id="aloj-sel-data" value="' + esc(alojForm.dataVistoria || todayISODate()) + '"></label>' +
      "</div>" +
      '<div class="btn-row">' +

      '<button type="button" class="btn btn-secondary" id="btn-aloj-termo"' + (hasAloj ? "" : " disabled") + ">Preencher termo de uso (entrada de colaborador)</button>" +
      "</div>" +

    );
  }
  function bindAlojMenu() {
    document.getElementById("aloj-sel-obra").addEventListener("change", function (e) { alojForm.obra = e.target.value; render(); });
    document.getElementById("aloj-sel-nome").addEventListener("input", function (e) {
      alojForm.alojamento = e.target.value;
      var has = !!e.target.value.trim();
      var btnC = document.getElementById("btn-aloj-checklist");
      var btnT = document.getElementById("btn-aloj-termo");
      if (btnC) btnC.disabled = !has;
      if (btnT) btnT.disabled = !has;

  /* =========================================================
     ALOJAMENTOS — itens do checklist (vistoria NR-18)
     ========================================================= */
  var ALOJ_FOTOS_MAX = 3;
  function renderAlojItemHtml(record, idx) {
    var it = record.itens[idx];
    var desc = ALOJAMENTO_ITENS[idx];
    var isNao = it.status === "nao";
    var cls = "aloj-item" + (it.status === "nao" ? " is-nao" : it.status === "sim" ? " is-sim" : "");
    var fotosArr = it.fotos || [];
    var atCap = fotosArr.length >= ALOJ_FOTOS_MAX;
    var fotos = fotosArr.map(function (url, fi) {
      return '<div class="foto-thumb" data-idx="' + fi + '"><img src="' + url + '" alt="Foto ' + (fi + 1) + ' do item ' + (idx + 1) + '"><button type="button" aria-label="Remover foto">×</button></div>';
    }).join("");
    return (
      '<div class="' + cls + '" data-idx="' + idx + '">' +
      '<div class="aloj-item-top">' +
      '<span class="item-num mono">' + (idx + 1) + "</span>" +
      '<p class="item-desc">' + esc(desc) + "</p>" +
      '<div class="status-group" role="group" aria-label="Status do item ' + (idx + 1) + '">' +
      '<button type="button" class="status-btn' + (it.status === "sim" ? " active" : "") + '" data-status="sim">SIM</button>' +
      '<button type="button" class="status-btn' + (it.status === "nao" ? " active" : "") + '" data-status="nao">NÃO</button>' +
      '<button type="button" class="status-btn' + (it.status === "na" ? " active" : "") + '" data-status="na">N/A</button>' +
      "</div></div>" +
      '<div class="aloj-item-extra"' + (isNao ? "" : " hidden") + ">" +
      '<label class="field"><span>Recomendação</span><input type="text" class="aloj-recomendacao" placeholder="O que precisa ser feito" value="' + esc(it.recomendacao) + '"></label>' +
      '<label class="field"><span>Prazo para correção</span><input type="date" class="aloj-prazo" value="' + esc(it.prazo) + '"></label>' +
      "</div>" +
      '<div class="foto-section">' +
      "<span>Fotos do item (1 a " + ALOJ_FOTOS_MAX + " — evidência da vistoria)</span>" +
      '<div class="foto-list">' + fotos + "</div>" +
      (atCap ?
        '<p class="history-sub">Limite de ' + ALOJ_FOTOS_MAX + ' fotos atingido para este item.</p>' :
        '<button type="button" class="foto-add-btn aloj-foto-add">📷 Tirar/anexar foto</button><input type="file" class="aloj-foto-input" accept="image/*" capture="environment" multiple hidden>') +
      "</div>" +
      "</div>"
    );
  }
  function refreshAlojItem(record, idx) {

  function renderDynList(list, kind, nomeLabel, withCargo) {
    var rows = list.map(function (item, idx) {
      return (
        '<div class="dyn-row" data-idx="' + idx + '">' +
        '<div class="dyn-row-top"><strong>' + esc(nomeLabel) + " " + (idx + 1) + "</strong>" +
        '<button type="button" class="dyn-remove-btn" data-idx="' + idx + '">Remover</button>' +
        "</div>" +
        '<div class="dyn-row-fields">' +
        '<label class="field"><span>Nome</span><input type="text" class="dyn-nome" data-idx="' + idx + '" value="' + esc(item.nome) + '"></label>' +
        (withCargo ? '<label class="field"><span>Cargo/função</span><input type="text" class="dyn-cargo" data-idx="' + idx + '" value="' + esc(item.cargo || "") + '"></label>' : "") +
        "</div>" +
        '<div class="sig-block"><span>Assinatura</span><div class="sig-pad-wrap"><canvas class="dyn-sig-canvas" data-idx="' + idx + '"></canvas><span class="sig-hint dyn-sig-hint" data-idx="' + idx + '">Assine aqui</span></div><button type="button" class="btn-ghost dyn-sig-clear" data-idx="' + idx + '">Limpar assinatura</button></div>' +
        "</div>"
      );
    }).join("");
    return '<div class="dyn-list">' + rows + "</div>";

  function mountAlojDynList(kind) {
    var record = alojSheet.record;
    var list = kind === "funcionarios" ? record.funcionarios : record.envolvidos;
    var wrap = document.getElementById(kind === "funcionarios" ? "funcionarios-list" : "envolvidos-list");
    if (!wrap) return;
    wrap.innerHTML = renderDynList(list, kind, kind === "funcionarios" ? "Funcionário" : "Envolvido", kind === "envolvidos");
    var ctlArr = kind === "funcionarios" ? sigCtlsFuncionarios : sigCtlsEnvolvidos;
    ctlArr.length = 0;
    wrap.querySelectorAll(".dyn-sig-canvas").forEach(function (canvas) {
      var idx = parseInt(canvas.getAttribute("data-idx"), 10);
      var hint = wrap.querySelector('.dyn-sig-hint[data-idx="' + idx + '"]');
      var ctl = setupSignaturePad(canvas, hint);
      var item = list[idx];
      if (item && item.assinatura) ctl.restore(item.assinatura);
      ctl.onChange = function (dataUrl) { if (list[idx]) list[idx].assinatura = dataUrl; };
      ctlArr[idx] = ctl;
    });
    wrap.querySelectorAll(".dyn-nome").forEach(function (input) {
      input.addEventListener("input", function (e) {
        var idx = parseInt(e.target.getAttribute("data-idx"), 10);
        if (list[idx]) list[idx].nome = e.target.value;
      });
    });
    wrap.querySelectorAll(".dyn-cargo").forEach(function (input) {
      input.addEventListener("input", function (e) {
        var idx = parseInt(e.target.getAttribute("data-idx"), 10);
        if (list[idx]) list[idx].cargo = e.target.value;
      });
    });
    wrap.querySelectorAll(".dyn-sig-clear").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        var idx = parseInt(e.target.getAttribute("data-idx"), 10);
        if (ctlArr[idx]) ctlArr[idx].clear();
      });
    });
    wrap.querySelectorAll(".dyn-remove-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        var idx = parseInt(e.target.getAttribute("data-idx"), 10);
        list.splice(idx, 1);
        mountAlojDynList(kind);
      });
    });
  }

    var record = alojSheet.record;
    document.getElementById("btn-aloj-voltar").addEventListener("click", function () { alojSheet = null; alojView = null; render(); });
    document.getElementById("aloj-horario").addEventListener("input", function (e) { record.horario = e.target.value; });
    document.getElementById("aloj-qtd-func").addEventListener("input", function (e) { record.quantidadeFuncionarios = e.target.value; });

    var itemsList = document.getElementById("aloj-items-list");
    itemsList.addEventListener("click", function (e) {
      var statusBtn = e.target.closest(".status-btn");
      if (statusBtn) {
        var row = statusBtn.closest(".aloj-item");
        var idx = parseInt(row.getAttribute("data-idx"), 10);
        var status = statusBtn.getAttribute("data-status");
        record.itens[idx].status = status;
        row.querySelectorAll(".status-btn").forEach(function (b) { b.classList.remove("active"); });
        statusBtn.classList.add("active");
        row.classList.remove("is-nao", "is-sim");
        if (status === "nao") row.classList.add("is-nao");
        if (status === "sim") row.classList.add("is-sim");
        var isNao = status === "nao";
        var extra = row.querySelector(".aloj-item-extra");
        if (extra) extra.hidden = !isNao;
        updateAlojScoreBadge(record);
        return;
      }
      var addFotoBtn = e.target.closest(".aloj-foto-add");
      if (addFotoBtn) {
        var row2 = addFotoBtn.closest(".aloj-item");
        row2.querySelector(".aloj-foto-input").click();
        return;
      }
      var removeFotoBtn = e.target.closest(".foto-thumb button");
      if (removeFotoBtn) {
        var row3 = removeFotoBtn.closest(".aloj-item");
        var idx3 = parseInt(row3.getAttribute("data-idx"), 10);
        var thumb = removeFotoBtn.closest(".foto-thumb");
        var fIdx = parseInt(thumb.getAttribute("data-idx"), 10);
        record.itens[idx3].fotos.splice(fIdx, 1);
        refreshAlojItem(record, idx3);
      }
    });
    itemsList.addEventListener("input", function (e) {
      var row = e.target.closest(".aloj-item");
      if (!row) return;
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      if (e.target.classList.contains("aloj-recomendacao")) record.itens[idx].recomendacao = e.target.value;
      if (e.target.classList.contains("aloj-prazo")) record.itens[idx].prazo = e.target.value;
    });
    itemsList.addEventListener("change", function (e) {
      if (!e.target.classList.contains("aloj-foto-input")) return;
      var row = e.target.closest(".aloj-item");
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      var files = Array.prototype.slice.call(e.target.files || []);
      e.target.value = "";
      if (!files.length) return;
      var remaining = ALOJ_FOTOS_MAX - (record.itens[idx].fotos || []).length;
      if (remaining <= 0) { toast("Este item já tem o limite de " + ALOJ_FOTOS_MAX + " fotos.", "error"); return; }
      if (files.length > remaining) {
        toast("Só é possível anexar mais " + remaining + " foto(s) neste item (limite de " + ALOJ_FOTOS_MAX + "). As demais foram ignoradas.", "error");
        files = files.slice(0, remaining);
      }
      toast("Processando " + files.length + " foto(s)…");
      compressImagesSequentially(files).then(function (dataUrls) {
        var falhou = false;
        dataUrls.forEach(function (url) { if (url) record.itens[idx].fotos.push(url); else falhou = true; });
        if (falhou) toast("Uma das fotos não pôde ser processada e foi ignorada.", "error");
        refreshAlojItem(record, idx);
      }).catch(function () {
        toast("Não foi possível processar uma das fotos.", "error");
      });
    });

    mountAlojDynList("funcionarios");
    mountAlojDynList("envolvidos");
    document.getElementById("btn-add-funcionario").addEventListener("click", function () {
      record.funcionarios.push({ nome: "", assinatura: null });
      mountAlojDynList("funcionarios");
    });
    document.getElementById("btn-add-envolvido").addEventListener("click", function () {
      record.envolvidos.push({ nome: "", cargo: "", assinatura: null });
      mountAlojDynList("envolvidos");
    });

    document.getElementById("btn-aloj-salvar").addEventListener("click", function () {
      persistAlojChecklist(alojSheet.key, record);
      toast("Vistoria do alojamento salva.");
      render();
    });
    document.getElementById("btn-aloj-pdf").addEventListener("click", function () { offerAlojChecklistPDF(record); });
  }

  /* =========================================================
     ALOJAMENTOS — PDF da vistoria (checklist NR-18)
     ========================================================= */
  function buildAlojChecklistPDF(record) {
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) return null;
    var doc = new jsPDFCtor({ unit: "mm", format: "a4", orientation: "portrait" });
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var marginX = 14;
    var y = 16;
    function ensureSpace(extra) {
      if (y + extra > pageHeight - 14) { doc.addPage("a4", "portrait"); y = 16; }
    }

    try {
      if (EMAIS_LOGO) {
        var logoW = 24, logoH = 24 * (273 / 844);
        doc.addImage(EMAIS_LOGO, "PNG", pageWidth - marginX - logoW, 8, logoW, logoH);
      }
    } catch (e) { /* logo é decorativo; segue sem ele se falhar */ }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("CHECKLIST ALOJAMENTO — NR-18", marginX, y);
    y += 5;
    doc.setDrawColor(200);
    doc.setLineWidth(0.4);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 6;

    var score = computeAlojScore(record.itens);
    var pct = score.pontuacao != null ? Math.round(score.pontuacao * 100) + "%" : "—";

    doc.setFontSize(9);
    doc.setFont("helvetica", "bold"); doc.text("Obra:", marginX, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.obra), marginX + 16, y);
    doc.setFont("helvetica", "bold"); doc.text("Alojamento:", marginX + 100, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.alojamento), marginX + 128, y);
    y += 5.5;
    doc.setFont("helvetica", "bold"); doc.text("Empresa:", marginX, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.empresa || "—"), marginX + 16, y);
    doc.setFont("helvetica", "bold"); doc.text("Data:", marginX + 100, y);
    doc.setFont("helvetica", "normal"); doc.text(dateBr(record.dataVistoria) + (record.horario ? " às " + record.horario : ""), marginX + 128, y);
    y += 5.5;
    doc.setFont("helvetica", "bold"); doc.text("Endereço:", marginX, y);
    doc.setFont("helvetica", "normal");
    var endLines = doc.splitTextToSize(String(record.endereco || "—"), 70);
    doc.text(endLines, marginX + 16, y);
    doc.setFont("helvetica", "bold"); doc.text("Qtd. funcionários:", marginX + 100, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.quantidadeFuncionarios || "—"), marginX + 138, y);
    y += Math.max(endLines.length * 4, 5.5) + 1;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    var cls = classificacaoClass(score.classificacao);
    var color = cls === "otimo" || cls === "bom" ? [46, 125, 79] : cls === "regular" ? [138, 90, 16] : cls === "vazio" ? [120, 120, 120] : [178, 58, 46];
    doc.setTextColor(color[0], color[1], color[2]);
    doc.text("Pontuação: " + pct + " — " + (score.classificacao || "Sem itens avaliados"), marginX, y);
    doc.setTextColor(20);
    y += 7;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.text("Itens verificados", marginX, y);
    y += 5;
    doc.setFontSize(7.8);

    record.itens.forEach(function (it, idx) {
      var label = it.status === "sim" ? "[SIM]" : it.status === "nao" ? "[NÃO]" : it.status === "na" ? "[N/A]" : "[ — ]";
      var labelColor = it.status === "sim" ? [46, 125, 79] : it.status === "nao" ? [178, 58, 46] : [120, 120, 120];
      ensureSpace(8);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
      doc.text(label, marginX, y);
      doc.setTextColor(20);
      doc.setFont("helvetica", "normal");
      var descLines = doc.splitTextToSize((idx + 1) + ". " + ALOJAMENTO_ITENS[idx], pageWidth - marginX * 2 - 16);
      doc.text(descLines, marginX + 16, y);
      y += descLines.length * 3.6;
      if (it.status === "nao" && (it.recomendacao || it.prazo)) {
        ensureSpace(6);
        doc.setFontSize(7.2);
        doc.setTextColor(110);
        var extraText = (it.recomendacao ? "Recomendação: " + it.recomendacao : "") + (it.prazo ? "   Prazo: " + dateBr(it.prazo) : "");
        var extraLines = doc.splitTextToSize(extraText, pageWidth - marginX * 2 - 16);
        doc.text(extraLines, marginX + 16, y);
        doc.setTextColor(20);
        doc.setFontSize(7.8);
        y += extraLines.length * 3.4;
      }
      y += 1.8;
    });

    var fotoEntries = [];
    record.itens.forEach(function (it, idx) {
      (it.fotos || []).forEach(function (foto, fi) { fotoEntries.push({ item: idx + 1, foto: foto, idx: fi + 1 }); });
    });
    if (fotoEntries.length) {
      ensureSpace(40);
      y += 3;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(20);
      doc.text("Fotos anexadas", marginX, y);
      y += 5;
      var fotoW = 40, fotoH = 30, fotoGap = 6, fotoPerRow = Math.max(1, Math.floor((pageWidth - marginX * 2) / (fotoW + fotoGap)));
      fotoEntries.forEach(function (fe, i) {
        var col = i % fotoPerRow, row = Math.floor(i / fotoPerRow);
        var fx = marginX + col * (fotoW + fotoGap), fy = y + row * (fotoH + 9);
        if (fy + fotoH + 9 > pageHeight - 14) { doc.addPage("a4", "portrait"); y = 16; fy = y; }
        drawPhotoBlock(doc, fe.foto, "Item " + fe.item + " — foto " + fe.idx, fx, fy, fotoW, fotoH);
      });
      var fotoRows = Math.ceil(fotoEntries.length / fotoPerRow);
      y += fotoRows * (fotoH + 9) + 2;
    }

    if (record.funcionarios && record.funcionarios.length) {
      ensureSpace(30);
      y += 3;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(20);
      doc.text("Funcionários alojados", marginX, y);
      y += 5;
      var sigW = 54, sigH = 18, gap = 8, perRow = Math.max(1, Math.floor((pageWidth - marginX * 2) / (sigW + gap)));
      record.funcionarios.forEach(function (f, i) {
        var col = i % perRow, row = Math.floor(i / perRow);
        var sx = marginX + col * (sigW + gap), sy = y + row * (sigH + 9);
        if (sy + sigH + 9 > pageHeight - 14) { doc.addPage("a4", "portrait"); y = 16; sy = y; }
        drawSignatureBlock(doc, f.assinatura, f.nome || "—", sx, sy, sigW, sigH);
      });
      var rows1 = Math.ceil(record.funcionarios.length / perRow);
      y += rows1 * (sigH + 9) + 2;
    }

    if (record.envolvidos && record.envolvidos.length) {
      ensureSpace(30);
      y += 3;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(20);
      doc.text("Assinatura dos envolvidos na vistoria", marginX, y);
      y += 5;
      var sigW2 = 54, sigH2 = 18, gap2 = 8, perRow2 = Math.max(1, Math.floor((pageWidth - marginX * 2) / (sigW2 + gap2)));
      record.envolvidos.forEach(function (ev, i) {
        var col = i % perRow2, row = Math.floor(i / perRow2);
        var sx = marginX + col * (sigW2 + gap2), sy = y + row * (sigH2 + 9);
        if (sy + sigH2 + 9 > pageHeight - 14) { doc.addPage("a4", "portrait"); y = 16; sy = y; }
        drawSignatureBlock(doc, ev.assinatura, (ev.nome || "—") + (ev.cargo ? " — " + ev.cargo : ""), sx, sy, sigW2, sigH2);
      });
      var rows2 = Math.ceil(record.envolvidos.length / perRow2);
      y += rows2 * (sigH2 + 9) + 2;
    }

    doc.setFontSize(7);
    doc.setTextColor(150);
    doc.text("Gerado por ObraCheck em " + new Date().toLocaleString("pt-BR"), marginX, pageHeight - 6);

    return doc;
  }
  function offerAlojChecklistPDF(record) {
    var doc = buildAlojChecklistPDF(record);
    if (!doc) { toast("Não foi possível gerar o PDF (biblioteca não carregou). Verifique a internet e tente novamente.", "error"); return; }
    var blob = doc.output("blob");
    var filename = "checklist_alojamento_" + slug(record.obra) + "_" + slug(record.alojamento) + "_" + record.dataVistoria + ".pdf";
    offerFile(blob, filename);
  }

      });

  // Só INSERT (sem upsert): um termo assinado é um documento legal — depois de
  // salvo não deve ser substituído por esta tela. A política de RLS da tabela
  // também não tem UPDATE para o anon, reforçando isso no lado do banco.
  function pushTermoToCloud(d) {
    var row = {
      obra: d.obra,
      alojamento: d.alojamento,
      empresa: d.empresa || null,
      colaborador_nome: d.colaboradorNome,
      colaborador_cpf: d.colaboradorCpf || null,
      data: d
    };
    return fetch(SUPABASE_URL + "/rest/v1/" + ALOJ_TERMO_TABLE, {
      method: "POST",
      headers: cloudHeaders({ "Prefer": "return=minimal" }),
      body: JSON.stringify([row])
    }).then(function (res) {
      var ok = res.ok;
      setSyncStatus(ok);
      return ok;
    }).catch(function () {
      setSyncStatus(false);
      return false;
    });
  }

  /* =========================================================

     ========================================================= */
  function buildTermoPDF(d) {
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;

        var logoW = 24, logoH = 24 * (273 / 844);
        doc.addImage(EMAIS_LOGO, "PNG", pageWidth - marginX - logoW, 8, logoW, logoH);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("TERMO DE USO DO ALOJAMENTO", marginX, y);

    doc.setDrawColor(200);
    doc.setLineWidth(0.4);

    doc.setFontSize(9);
    var fields = [

      ["Colaborador", d.colaboradorNome || "—"],

  /* =========================================================
     DASHBOARD — indicadores do checklist de máquinas
     ========================================================= */
  function lastNMonthsISO(n) {
    var out = [];
    var d = new Date();
    for (var i = 0; i < n; i++) {
      out.push(d.getFullYear() + "-" + pad2(d.getMonth() + 1));
      d.setMonth(d.getMonth() - 1);
    }
    return out;
  }
  function recordInDashPeriod(record, periodo) {
    if (periodo === "tudo") return true;
    if (periodo === "mes") return record.mesAno === currentMonthISO();
    return lastNMonthsISO(3).indexOf(record.mesAno) !== -1; // "3m"
  }
  // Faixas de adesão usadas tanto no preenchimento quanto no fechamento assinado
  // — mesma lógica de "bom/alerta/crítico" que o app já usa para a pontuação dos alojamentos.
  function statusClassForRate(pct) {
    if (pct == null) return "";
    if (pct >= 90) return "is-good";
    if (pct >= 70) return "is-warning";
    return "is-critical";
  }
  function computeDashboardData(periodo, obraFiltro) {
    var months = loadMonths();
    var records = Object.keys(months).map(function (k) { return months[k]; }).filter(function (r) {
      if (!recordInDashPeriod(r, periodo)) return false;
      if (obraFiltro && r.obra !== obraFiltro) return false;
      return true;
    });

    var ncByObra = {}, totalByObra = {};
    var ncByTipo = {}, totalByTipo = {};
    var ncByItem = {};
    var filledDaysByObra = {}, possibleDaysByObra = {};
    var filledDaysTotal = 0, possibleDaysTotal = 0;
    var fechamentoTotal = 0, fechamentoAssinado = 0;
    var pendentesFechamento = [];

    records.forEach(function (r) {
      var obra = r.obra;
      var tipoLabel = machineLabel(r.maquinaTipoKey);
      var effDays = isCurrentMonth(r.mesAno) ? parseInt(todayDayOfMonth(), 10) : daysInMonth(r.mesAno);
      var diaKeys = Object.keys(r.dias || {});

      diaKeys.forEach(function (diaKey) {
        var statuses = r.dias[diaKey].statuses || [];
        statuses.forEach(function (st, idx) {
          if (st === "nc") {
            ncByObra[obra] = (ncByObra[obra] || 0) + 1;
            ncByTipo[tipoLabel] = (ncByTipo[tipoLabel] || 0) + 1;
            var itemDesc = (r.itens && r.itens[idx]) || "?";
            var itemKey = tipoLabel + " — " + itemDesc;
            ncByItem[itemKey] = (ncByItem[itemKey] || 0) + 1;
          }
          if (st === "ok" || st === "nc" || st === "na") {
            totalByObra[obra] = (totalByObra[obra] || 0) + 1;
            totalByTipo[tipoLabel] = (totalByTipo[tipoLabel] || 0) + 1;
          }
        });
      });

      filledDaysByObra[obra] = (filledDaysByObra[obra] || 0) + diaKeys.length;
      possibleDaysByObra[obra] = (possibleDaysByObra[obra] || 0) + effDays;
      filledDaysTotal += diaKeys.length;
      possibleDaysTotal += effDays;

      fechamentoTotal++;
      var fech = r.fechamento;
      if (fech && fech.operadorAssinatura && fech.tstAssinatura) {
        fechamentoAssinado++;
      } else {
        pendentesFechamento.push({
          key: monthKey(r.obra, r.maquinaTipoKey, r.maquinaId, r.mesAno),
          obra: r.obra, tipoLabel: tipoLabel, maquinaId: r.maquinaId, mesAno: r.mesAno
        });
      }
    });

    var totalNC = Object.keys(ncByObra).reduce(function (sum, k) { return sum + ncByObra[k]; }, 0);

    return {
      totalRecords: records.length,
      totalNC: totalNC,
      ncByObra: ncByObra, totalByObra: totalByObra,
      ncByTipo: ncByTipo, totalByTipo: totalByTipo,
      ncByItem: ncByItem,
      filledDaysByObra: filledDaysByObra, possibleDaysByObra: possibleDaysByObra,
      preenchimentoGeral: possibleDaysTotal > 0 ? Math.min(100, (filledDaysTotal / possibleDaysTotal) * 100) : null,
      fechamentoTotal: fechamentoTotal, fechamentoAssinado: fechamentoAssinado,
      fechamentoPct: fechamentoTotal > 0 ? (fechamentoAssinado / fechamentoTotal) * 100 : null,
      pendentesFechamento: pendentesFechamento
    };
  }
  function rankBarRow(label, value, maxValue, displayValue, barColor, subtext) {
    var pct = maxValue > 0 ? Math.min(100, Math.round((value / maxValue) * 100)) : 0;
    return (
      '<div class="rank-row">' +
      '<div class="rank-row-top"><span class="rank-label">' + esc(label) + '</span><span class="rank-value mono">' + esc(displayValue) + "</span></div>" +
      '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + pct + "%;background:" + barColor + ';"></div></div>' +
      (subtext ? '<span class="rank-sub">' + esc(subtext) + "</span>" : "") +
      "</div>"
    );
  }
  function openDashboardRecord(key) {
    var months = loadMonths();
    var record = months[key];
    if (!record) { toast("Planilha não encontrada.", "error"); return; }
    sheet = { key: key, record: record, selectedDay: isCurrentMonth(record.mesAno) ? todayDayOfMonth() : "01" };
    switchTab("maquinas");
  }
  function renderDashboard() {
    var data = computeDashboardData(dashFilter.periodo, dashFilter.obra);
    var obraOptions = '<option value="">Todas as obras</option>' + OBRAS.map(function (o) {
      return '<option value="' + esc(o) + '"' + (dashFilter.obra === o ? " selected" : "") + ">" + esc(o) + "</option>";
    }).join("");
    var periodoOptions = [["3m", "Últimos 3 meses"], ["mes", "Mês atual"], ["tudo", "Todo o histórico"]].map(function (p) {
      return '<option value="' + p[0] + '"' + (dashFilter.periodo === p[0] ? " selected" : "") + ">" + p[1] + "</option>";
    }).join("");
    var filtersHtml =
      '<div class="dash-filters">' +
      '<label class="field"><span>Obra</span><select id="dash-sel-obra">' + obraOptions + "</select></label>" +
      '<label class="field"><span>Período</span><select id="dash-sel-periodo">' + periodoOptions + "</select></label>" +
      "</div>";

    if (!data.totalRecords) {
      return (
        '<section class="card">' +
        '<p class="card-eyebrow">Dashboard</p>' +
        '<h1 class="card-title">Indicadores do checklist de máquinas</h1>' +
        filtersHtml +
        '<p class="closing-status is-pending">Nenhuma planilha encontrada para este filtro ainda.</p>' +
        "</section>"
      );
    }

    var preenchPct = data.preenchimentoGeral;
    var fechPct = data.fechamentoPct;
    var statTiles =
      '<div class="stat-tile"><span class="stat-tile-label">Não conformidades</span><span class="stat-tile-value' + (data.totalNC > 0 ? " is-critical" : " is-good") + '">' + data.totalNC + '</span><span class="stat-tile-sub">no período selecionado</span></div>' +
      '<div class="stat-tile"><span class="stat-tile-label">Taxa de preenchimento</span><span class="stat-tile-value ' + statusClassForRate(preenchPct) + '">' + (preenchPct != null ? Math.round(preenchPct) + "%" : "—") + '</span><span class="stat-tile-sub">dias preenchidos vs. dias decorridos no período</span></div>' +
      '<div class="stat-tile"><span class="stat-tile-label">Fechamento assinado</span><span class="stat-tile-value ' + statusClassForRate(fechPct) + '">' + (fechPct != null ? Math.round(fechPct) + "%" : "—") + '</span><span class="stat-tile-sub">' + data.fechamentoAssinado + " de " + data.fechamentoTotal + ' planilha(s)</span></div>';

    var obraRanking = Object.keys(data.ncByObra).map(function (o) { return { label: o, value: data.ncByObra[o], total: data.totalByObra[o] || 0 }; }).sort(function (a, b) { return b.value - a.value; });
    var maxObraNC = obraRanking.length ? obraRanking[0].value : 0;
    var obraRankingHtml = obraRanking.length ? obraRanking.map(function (row) {
      var rate = row.total > 0 ? (row.value / row.total * 100).toFixed(1) + "% dos itens verificados nesta obra" : "";
      return rankBarRow(row.label, row.value, maxObraNC, String(row.value), "var(--nc)", rate);
    }).join("") : '<p class="closing-status">Nenhuma não conformidade registrada no período.</p>';

    var tipoRanking = Object.keys(data.ncByTipo).map(function (t) { return { label: t, value: data.ncByTipo[t], total: data.totalByTipo[t] || 0 }; }).sort(function (a, b) { return b.value - a.value; });
    var maxTipoNC = tipoRanking.length ? tipoRanking[0].value : 0;
    var tipoRankingHtml = tipoRanking.length ? tipoRanking.map(function (row) {
      var rate = row.total > 0 ? (row.value / row.total * 100).toFixed(1) + "% dos itens verificados neste tipo" : "";
      return rankBarRow(row.label, row.value, maxTipoNC, String(row.value), "var(--nc)", rate);
    }).join("") : '<p class="closing-status">Nenhuma não conformidade registrada no período.</p>';

    var itemRankingArr = Object.keys(data.ncByItem).map(function (k) { return { label: k, value: data.ncByItem[k] }; }).sort(function (a, b) { return b.value - a.value; }).slice(0, 10);
    var maxItemNC = itemRankingArr.length ? itemRankingArr[0].value : 0;
    var itemRankingHtml = itemRankingArr.length ? itemRankingArr.map(function (row) {
      return rankBarRow(row.label, row.value, maxItemNC, String(row.value), "var(--nc)", "");
    }).join("") : '<p class="closing-status">Nenhuma não conformidade registrada no período.</p>';

    var preenchRanking = Object.keys(data.possibleDaysByObra).map(function (o) {
      var poss = data.possibleDaysByObra[o] || 0;
      var fill = data.filledDaysByObra[o] || 0;
      return { label: o, pct: poss > 0 ? Math.min(100, (fill / poss) * 100) : null, fill: fill, poss: poss };
    }).filter(function (r) { return r.pct != null; }).sort(function (a, b) { return a.pct - b.pct; });
    var preenchRankingHtml = preenchRanking.length ? preenchRanking.map(function (row) {
      var barColor = row.pct >= 90 ? "var(--ok)" : row.pct >= 70 ? "#c98500" : "var(--nc)";
      return rankBarRow(row.label, row.pct, 100, Math.round(row.pct) + "%", barColor, row.fill + " de " + row.poss + " dia(s) preenchidos");
    }).join("") : '<p class="closing-status">Sem dados de preenchimento no período.</p>';

    var pendentesHtml = data.pendentesFechamento.slice(0, 8).map(function (p) {
      return (
        '<div class="dash-pending-row">' +
        "<span>" + esc(p.obra) + " — " + esc(p.tipoLabel) + (p.maquinaId ? " (" + esc(p.maquinaId) + ")" : "") + " — " + esc(monthLabel(p.mesAno)) + "</span>" +
        '<button type="button" class="btn btn-secondary dash-open-sheet" data-key="' + esc(p.key) + '">Abrir</button>' +
        "</div>"
      );
    }).join("");

    return (
      '<section class="card">' +
      '<p class="card-eyebrow">Dashboard</p>' +
      '<h1 class="card-title">Indicadores do checklist de máquinas</h1>' +
      filtersHtml +
      '<div class="stat-grid">' + statTiles + "</div>" +
      '<div class="dash-section">' +
      '<h2 class="dash-section-title">Não conformidades por obra</h2>' +
      '<p class="dash-section-hint">Quantidade de itens marcados como não conforme no período, por obra.</p>' +
      '<div class="rank-list">' + obraRankingHtml + "</div>" +
      "</div>" +
      '<div class="dash-section">' +
      '<h2 class="dash-section-title">Não conformidades por tipo de máquina</h2>' +
      '<p class="dash-section-hint">Quais equipamentos mais geram não conformidade no período.</p>' +
      '<div class="rank-list">' + tipoRankingHtml + "</div>" +
      "</div>" +
      '<div class="dash-section">' +
      '<h2 class="dash-section-title">Itens do checklist mais recorrentes em NC</h2>' +
      '<p class="dash-section-hint">Os 10 itens que mais aparecem como não conforme — aponta falhas que se repetem, não só casos isolados.</p>' +
      '<div class="rank-list">' + itemRankingHtml + "</div>" +
      "</div>" +
      '<div class="dash-section">' +
      '<h2 class="dash-section-title">Taxa de preenchimento por obra</h2>' +
      '<p class="dash-section-hint">Dias preenchidos em relação aos dias já decorridos no período — as obras no topo da lista precisam de mais atenção.</p>' +
      '<div class="rank-list">' + preenchRankingHtml + "</div>" +
      "</div>" +
      (data.pendentesFechamento.length ?
        '<div class="dash-section">' +
        '<h2 class="dash-section-title">Planilhas sem fechamento assinado</h2>' +
        '<p class="dash-section-hint">' + data.pendentesFechamento.length + " planilha(s) no período ainda sem a assinatura de encerramento (operador + TST).</p>" +
        '<div class="dash-pending-list">' + pendentesHtml + (data.pendentesFechamento.length > 8 ? '<p class="rank-sub">+ ' + (data.pendentesFechamento.length - 8) + " outra(s) não exibida(s).</p>" : "") + "</div>" +
        "</div>" : "") +
      "</section>"
    );
  }
