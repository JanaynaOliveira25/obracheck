  /* =========================================================
     GERAÇÃO DE ARQUIVOS (PDF e backup)
     ========================================================= */
  function offerFile(blob, filename) {
    if (capDownloads) {
      return capDownloads.save({ filename: filename, data: blob }).then(function () {
        toast("Salvo: " + filename);
        return true;
      }).catch(function (err) {
        if (err && err.code === "declined") return false;
        return fallbackDownload(blob, filename);
      });
    }
    return Promise.resolve(fallbackDownload(blob, filename));
  }
  function fallbackDownload(blob, filename) {
    try {
      var url = URL.createObjectURL(blob);
      // tentativa automática (funciona na maioria dos navegadores desktop e Android)
      try {
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      } catch (e) { /* segue para o link manual abaixo, que cobre iOS/Safari e navegadores restritos */ }
      showDownloadBar(url, filename);
      return true;
    } catch (e) {
      toast("Não foi possível preparar o arquivo neste dispositivo.", "error");
      return false;
    }
  }

  function showDownloadBar(url, filename) {
    var old = document.getElementById("download-bar");
    if (old) old.parentNode.removeChild(old);
    var bar = document.createElement("div");
    bar.className = "download-bar";
    bar.id = "download-bar";
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Toque aqui para abrir/salvar: " + filename;
    var closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.setAttribute("aria-label", "Fechar");
    closeBtn.textContent = "×";
    var revoked = false;
    function cleanup() {
      if (bar.parentNode) bar.parentNode.removeChild(bar);
      if (!revoked) { revoked = true; setTimeout(function () { URL.revokeObjectURL(url); }, 500); }
    }
    closeBtn.addEventListener("click", cleanup);
    link.addEventListener("click", function () { setTimeout(cleanup, 800); });
    bar.appendChild(link);
    bar.appendChild(closeBtn);
    document.body.appendChild(bar);
    // some navegadores fecham sozinho depois de um tempo generoso, caso o usuário não interaja
    setTimeout(cleanup, 60000);
  }

  function drawPhotoBlock(doc, dataUrl, label, x, y, w, h) {
    doc.setDrawColor(190);
    doc.setLineWidth(0.3);
    doc.rect(x, y, w, h);
    if (dataUrl) {
      try {
        var props = doc.getImageProperties(dataUrl);
        var ratio = Math.min((w - 2) / props.width, (h - 2) / props.height);
        var iw = props.width * ratio, ih = props.height * ratio;
        var ix = x + (w - iw) / 2, iy = y + (h - ih) / 2;
        doc.addImage(dataUrl, "JPEG", ix, iy, iw, ih, undefined, "FAST");
      } catch (e) { /* prova em foto é um extra; segue sem ela se a imagem falhar */ }
    }
    doc.setFontSize(7);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(90);
    doc.text(label, x, y + h + 3.2);
    doc.setTextColor(20);
  }

  function drawSignatureBlock(doc, dataUrl, label, x, y, w, h) {
    doc.setDrawColor(190);
    doc.setLineWidth(0.3);
    doc.rect(x, y, w, h);
    if (dataUrl) {
      try { doc.addImage(dataUrl, "PNG", x + 1, y + 1, w - 2, h - 2, undefined, "FAST"); } catch (e) {}
    }
    doc.setFontSize(7);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(90);
    doc.text(label, x, y + h + 3.2);
    doc.setTextColor(20);
  }

  function buildMonthPDF(record) {
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) return null;
    var doc = new jsPDFCtor({ unit: "mm", format: "a4", orientation: "landscape" });
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var marginX = 12;
    var y = 14;

    try {
      if (EMAIS_LOGO) {
        var logoW = 26, logoH = 26 * (273 / 844);
        doc.addImage(EMAIS_LOGO, "PNG", pageWidth - marginX - logoW, 7, logoW, logoH);
      }
    } catch (e) { /* logo é decorativo; segue sem ele se falhar */ }

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("CHECK LIST — " + machineLabel(record.maquinaTipoKey).toUpperCase() + " — " + monthLabel(record.mesAno).toUpperCase(), marginX, y);
    y += 5;
    doc.setDrawColor(200);
    doc.setLineWidth(0.4);
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 5.5;

    doc.setFontSize(9);
    doc.setFont("helvetica", "bold"); doc.text("Obra:", marginX, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.obra), marginX + 14, y);
    doc.setFont("helvetica", "bold"); doc.text("Máquina/Identificação:", marginX + 90, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.maquinaId || "—"), marginX + 138, y);
    y += 5;
    doc.setFont("helvetica", "bold"); doc.text("Empresa:", marginX, y);
    doc.setFont("helvetica", "normal"); doc.text(String(record.empresa || "—"), marginX + 14, y);
    doc.setFont("helvetica", "bold"); doc.text("Período:", marginX + 90, y);
    doc.setFont("helvetica", "normal"); doc.text("Diário — legenda: O = OK   X = Não conforme   — = N/A", marginX + 108, y);
    y += 7;

    // legenda dos itens
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.text("Itens verificados", marginX, y);
    y += 4;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.3);
    var legendColWidth = (pageWidth - marginX * 2) / 2;
    record.itens.forEach(function (desc, idx) {
      var col = idx % 2;
      var row = Math.floor(idx / 2);
      var lines = doc.splitTextToSize((idx + 1) + ". " + desc, legendColWidth - 4);
      doc.text(lines, marginX + col * legendColWidth, y + row * 3.6 * Math.max(1, 1));
    });
    var legendRows = Math.ceil(record.itens.length / 2);
    y += legendRows * 3.7 + 4;

    // grade do mês
    var nDays = daysInMonth(record.mesAno);
    var labelColW = 9;
    var dayColW = (pageWidth - marginX * 2 - labelColW) / nDays;
    var rowH = 5.4;
    var gridTop = y;
    var totalRows = record.itens.length + 1; // + linha do operador
    var gridBottom = gridTop + rowH * (totalRows + 1); // +1 para cabeçalho

    if (gridBottom > pageHeight - 30) {
      // margem de segurança; reduz altura de linha se necessário
      rowH = Math.max(3.6, (pageHeight - 30 - gridTop) / (totalRows + 1));
      gridBottom = gridTop + rowH * (totalRows + 1);
    }

    // cabeçalho da grade (números dos dias)
    doc.setFontSize(6.6);
    doc.setFont("helvetica", "bold");
    doc.setDrawColor(170);
    doc.setLineWidth(0.2);
    doc.rect(marginX, gridTop, labelColW, rowH);
    doc.text("Item", marginX + labelColW / 2, gridTop + rowH / 2 + 1, { align: "center" });
    for (var d = 1; d <= nDays; d++) {
      var cx = marginX + labelColW + (d - 1) * dayColW;
      doc.rect(cx, gridTop, dayColW, rowH);
      doc.text(String(d), cx + dayColW / 2, gridTop + rowH / 2 + 1, { align: "center" });
    }

    // linhas dos itens
    doc.setFont("helvetica", "normal");
    record.itens.forEach(function (desc, idx) {
      var ry = gridTop + rowH * (idx + 1);
      doc.setFont("helvetica", "bold");
      doc.rect(marginX, ry, labelColW, rowH);
      doc.text(String(idx + 1), marginX + labelColW / 2, ry + rowH / 2 + 1, { align: "center" });
      doc.setFont("helvetica", "normal");
      for (var dd = 1; dd <= nDays; dd++) {
        var cx2 = marginX + labelColW + (dd - 1) * dayColW;
        doc.rect(cx2, ry, dayColW, rowH);
        var dayEntry = record.dias[pad2(dd)];
        var st = dayEntry ? dayEntry.statuses[idx] : null;
        var sym = st === "ok" ? "O" : st === "nc" ? "X" : st === "na" ? "—" : "";
        if (st === "nc") { doc.setTextColor(178, 58, 46); } else if (st === "ok") { doc.setTextColor(46, 125, 79); } else { doc.setTextColor(120); }
        doc.text(sym, cx2 + dayColW / 2, ry + rowH / 2 + 1, { align: "center" });
        doc.setTextColor(20);
      }
    });

    // linha do operador (rubrica/iniciais por dia)
    var opRowY = gridTop + rowH * (record.itens.length + 1);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(6.2);
    doc.rect(marginX, opRowY, labelColW, rowH);
    doc.text("Visto", marginX + labelColW / 2, opRowY + rowH / 2 + 1, { align: "center" });
    doc.setFont("helvetica", "normal");
    for (var d3 = 1; d3 <= nDays; d3++) {
      var cx3 = marginX + labelColW + (d3 - 1) * dayColW;
      doc.rect(cx3, opRowY, dayColW, rowH);
      var de = record.dias[pad2(d3)];
      if (de && de.operador) doc.text(initials(de.operador), cx3 + dayColW / 2, opRowY + rowH / 2 + 1, { align: "center" });
    }

    y = gridBottom + 6;

    // operadores do mês (nomes completos, referência das iniciais)
    var operadoresUnicos = {};
    Object.keys(record.dias).forEach(function (k) { var op = record.dias[k].operador; if (op) operadoresUnicos[initials(op)] = op; });
    var opList = Object.keys(operadoresUnicos).map(function (ini) { return ini + " = " + operadoresUnicos[ini]; }).join("   ·   ");
    if (opList) {
      doc.setFontSize(7);
      doc.setTextColor(110);
      var opLines = doc.splitTextToSize("Operadores: " + opList, pageWidth - marginX * 2);
      doc.text(opLines, marginX, y);
      doc.setTextColor(20);
      y += opLines.length * 3.4 + 4;
    }

    // não conformidades do mês
    var ncEntries = [];
    Object.keys(record.dias).sort().forEach(function (dia) {
      var de2 = record.dias[dia];
      de2.statuses.forEach(function (st2, idx2) {
        if (st2 === "nc") ncEntries.push({ dia: dia, item: idx2 + 1, desc: record.itens[idx2], obs: de2.observacao, operador: de2.operador });
      });
    });
    if (ncEntries.length) {
      if (y + 14 > pageHeight - 14) { doc.addPage("a4", "landscape"); y = 16; }
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(178, 58, 46);
      doc.text("Não conformidades observadas no mês", marginX, y);
      doc.setTextColor(20);
      y += 5;
      doc.setFontSize(7.6);
      ncEntries.forEach(function (nc) {
        if (y + 8 > pageHeight - 14) { doc.addPage("a4", "landscape"); y = 16; }
        doc.setFont("helvetica", "bold");
        doc.text("Dia " + nc.dia + " — Item " + nc.item + ":", marginX, y);
        doc.setFont("helvetica", "normal");
        var w = doc.getTextWidth("Dia " + nc.dia + " — Item " + nc.item + ": ");
        var obsLines = doc.splitTextToSize(nc.desc + (nc.obs ? " — " + nc.obs : "") + " (operador: " + nc.operador + ")", pageWidth - marginX * 2 - w - 2);
        doc.text(obsLines, marginX + w + 2, y);
        y += obsLines.length * 3.6 + 2.4;
      });
    }

    // assinaturas dos dias com não conformidade
    var sigDays = Object.keys(record.dias).filter(function (k) { return record.dias[k].assinatura; }).sort();
    if (sigDays.length) {
      if (y + 34 > pageHeight - 14) { doc.addPage("a4", "landscape"); y = 16; }
      y += 3;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.text("Assinaturas registradas (dias com não conformidade)", marginX, y);
      y += 4;
      var sigW = 44, sigH = 16, gap = 6, perRow = Math.max(1, Math.floor((pageWidth - marginX * 2) / (sigW + gap)));
      sigDays.forEach(function (dia, i) {
        var col = i % perRow, row = Math.floor(i / perRow);
        var sx = marginX + col * (sigW + gap), sy = y + row * (sigH + 8);
        if (sy + sigH + 8 > pageHeight - 10) { doc.addPage("a4", "landscape"); y = 16; sy = y; }
        drawSignatureBlock(doc, record.dias[dia].assinatura, "Dia " + dia + " — " + record.dias[dia].operador, sx, sy, sigW, sigH);
      });
      var sigRows = Math.ceil(sigDays.length / perRow);
      y += sigRows * (sigH + 8) + 2;
    }

    // fotos anexadas como prova das não conformidades
    var fotoEntries = [];
    Object.keys(record.dias).sort().forEach(function (dia) {
      var de3 = record.dias[dia];
      (de3.fotos || []).forEach(function (foto, i) {
        fotoEntries.push({ dia: dia, foto: foto, idx: i + 1 });
      });
    });
    if (fotoEntries.length) {
      if (y + 40 > pageHeight - 14) { doc.addPage("a4", "landscape"); y = 16; }
      y += 3;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.setTextColor(20);
      doc.text("Fotos anexadas (prova das não conformidades)", marginX, y);
      y += 4;
      var fotoW = 40, fotoH = 30, fotoGap = 6, fotoPerRow = Math.max(1, Math.floor((pageWidth - marginX * 2) / (fotoW + fotoGap)));
      fotoEntries.forEach(function (fe, i) {
        var col = i % fotoPerRow, row = Math.floor(i / fotoPerRow);
        var fx = marginX + col * (fotoW + fotoGap), fy = y + row * (fotoH + 9);
        if (fy + fotoH + 9 > pageHeight - 10) { doc.addPage("a4", "landscape"); y = 16; fy = y; }
        drawPhotoBlock(doc, fe.foto, "Dia " + fe.dia + " — foto " + fe.idx, fx, fy, fotoW, fotoH);
      });
      var fotoRows = Math.ceil(fotoEntries.length / fotoPerRow);
      y += fotoRows * (fotoH + 9) + 2;
    }

    // fechamento do mês (assinaturas do operador responsável e do TST)
    var fech = record.fechamento;
    if (fech && fech.operadorAssinatura && fech.tstAssinatura) {
      var closeW = 78, closeH = 26;
      if (y + closeH + 14 > pageHeight - 14) { doc.addPage("a4", "landscape"); y = 16; }
      y += 3;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(20);
      doc.text("Fechamento do mês", marginX, y);
      y += 5;
      drawSignatureBlock(doc, fech.operadorAssinatura, "Operador responsável — " + fech.operadorNome, marginX, y, closeW, closeH);
      drawSignatureBlock(doc, fech.tstAssinatura, "TST responsável — " + fech.tstNome, marginX + closeW + 10, y, closeW, closeH);
      doc.setFontSize(7);
      doc.setTextColor(120);
      doc.text("Assinado em " + fech.data, marginX, y + closeH + 5);
      doc.setTextColor(20);
      y += closeH + 9;
    }

    doc.setFontSize(7);
    doc.setTextColor(150);
    doc.text("Gerado por ObraCheck em " + new Date().toLocaleString("pt-BR"), marginX, pageHeight - 6);

    return doc;
  }

  function offerMonthPDF(record) {
    var doc = buildMonthPDF(record);
    if (!doc) { toast("Não foi possível gerar o PDF (biblioteca não carregou). Verifique a internet e tente novamente.", "error"); return; }
    var blob = doc.output("blob");

  function offerBackup(record) {
    var blob = new Blob([JSON.stringify(record, null, 2)], { type: "application/json" });
    var filename = "obracheck_backup_" + slug(record.obra) + "_" + slug(machineLabel(record.maquinaTipoKey)) + "_" + record.mesAno + ".json";
    offerFile(blob, filename);

  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var imported;
      try { imported = JSON.parse(String(reader.result)); } catch (e) { toast("Arquivo de backup inválido.", "error"); return; }
      if (!imported || !imported.obra || !imported.maquinaTipoKey || !imported.mesAno || !imported.dias) {
        toast("Arquivo de backup inválido.", "error"); return;
      }
      var key = monthKey(imported.obra, imported.maquinaTipoKey, imported.maquinaId, imported.mesAno);
      var months = loadMonths();
      var exists = !!months[key];
      if (exists && !window.confirm("Já existe uma planilha salva para " + imported.obra + " / " + machineLabel(imported.maquinaTipoKey) + " / " + monthLabel(imported.mesAno) + " neste aparelho. Importar vai SUBSTITUIR os dados daqui. Continuar?")) {
        return;
      }
      persistRecord(key, imported, months);
      toast("Backup importado: " + imported.obra + " / " + machineLabel(imported.maquinaTipoKey) + " / " + monthLabel(imported.mesAno));
      if (sheet && sheet.key === key) { sheet.record = imported; openDay(sheet.selectedDay); } else { render(); }
    };
    reader.readAsText(file);
  }

  /* =========================================================
     TOAST
     ========================================================= */
  var toastTimer = null;
  function toast(msg, kind) {
    var el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
    el.textContent = msg;
    el.className = "toast show" + (kind ? " toast-" + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3800);
  }

  /* =========================================================
     ASSINATURA (canvas touch/mouse)
     ========================================================= */
  function setupSignaturePad(canvas, hintEl) {
    var ctx = canvas.getContext("2d");
    var ratio = Math.min(window.devicePixelRatio || 1, 2);
    var drawing = false, hasInk = false, last = null;

    // Dimensiona o canvas a partir do tamanho exibido na tela. Se o campo estiver
    // escondido (ex.: seção de não conformidade ainda fechada), o tamanho vem
    // zerado — por isso essa função precisa ser chamável de novo (resize()) assim
    // que o campo aparecer, ou a assinatura desenhada não fica alinhada/visível.
    function applySize() {
      var rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * ratio));
      canvas.height = Math.max(1, Math.round(rect.height * ratio));
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#1D1912";
    }
    applySize();

    function pos(evt) { var r = canvas.getBoundingClientRect(); return { x: evt.clientX - r.left, y: evt.clientY - r.top }; }
    function start(evt) { evt.preventDefault(); drawing = true; last = pos(evt); if (hintEl) hintEl.classList.add("hidden"); }
    function move(evt) {
      if (!drawing) return;
      evt.preventDefault();
      var p = pos(evt);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; hasInk = true;
    }
    function end() { if (!drawing) return; drawing = false; if (hasInk) ctl.onChange(canvas.toDataURL("image/png")); }
    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    canvas.addEventListener("pointerleave", function (e) { if (drawing) end(e); });

    var ctl = {
      isEmpty: function () { return !hasInk; },
      clear: function () { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; if (hintEl) hintEl.classList.remove("hidden"); ctl.onChange(null); },
      restore: function (dataUrl) {
        if (!dataUrl) return;
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width / ratio, canvas.height / ratio); hasInk = true; if (hintEl) hintEl.classList.add("hidden"); };
        img.src = dataUrl;
      },
      // Chame sempre que o campo, antes escondido, ficar visível — refaz a
      // resolução interna do canvas a partir do tamanho real agora exibido,
      // preservando o traço já desenhado (se houver).
      resize: function () {
        if (!canvas.isConnected) return; // canvas de um dia anterior, já substituído no DOM
        var snapshot = hasInk ? canvas.toDataURL("image/png") : null;
        applySize();
        if (snapshot) {
          var img = new Image();
          img.onload = function () { ctx.drawImage(img, 0, 0, canvas.width / ratio, canvas.height / ratio); };
          img.src = snapshot;
        }
      },
      onChange: function () {}
    };
    return ctl;
  }

  /* =========================================================
     RENDER — SELEÇÃO (obra / máquina / mês)
     ========================================================= */
  function render() {
    if (activeTab === "dashboard") {
      root.innerHTML = renderDashboard();
      bindDashboard();
      return;
    }
    if (activeTab === "alojamentos") {
      root.innerHTML = renderAlojamentosTab();
      bindAlojamentosTab();
      return;
    }
    if (historyView) {
      root.innerHTML = renderHistory();
      bindHistory();
      return;
    }
    root.innerHTML = sheet ? renderSheet() : renderSelection();
    if (sheet) { bindSheetShell(); mountDayForm(); } else { bindSelection(); }
  }

  function renderSelection() {
    var obraOptions = OBRAS.map(function (o) { return '<option value="' + esc(o) + '"' + (selForm.obra === o ? " selected" : "") + ">" + esc(o) + "</option>"; }).join("");
    var machineOptions = Object.keys(MACHINE_TYPES).map(function (k) { return '<option value="' + k + '"' + (selForm.maquinaTipo === k ? " selected" : "") + ">" + esc(MACHINE_TYPES[k].label) + "</option>"; }).join("");
    var selectedMachine = selForm.maquinaTipo ? MACHINE_TYPES[selForm.maquinaTipo] : null;
    var photoBlock = selectedMachine && selectedMachine.foto ?
      '<div class="machine-photo-row">' +
      '<img src="' + selectedMachine.foto + '" alt="Foto de referência — ' + esc(selectedMachine.label) + '">' +
      '<div class="machine-photo-caption"><strong>' + esc(selectedMachine.label) + '</strong>Foto de referência do equipamento conforme cadastro</div>' +
      "</div>" : "";
    return (
      '<section class="card selection-card">' +
      '<p class="card-eyebrow">Passo 1</p>' +
      '<h1 class="card-title">Abrir planilha do mês</h1>' +
      photoBlock +
      '<div class="field-grid">' +
      '<label class="field"><span>Obra</span><select id="sel-obra">' + obraOptions + "</select></label>" +
      '<label class="field"><span>Máquina</span><select id="sel-maquina"><option value="">Selecione o tipo…</option>' + machineOptions + "</select></label>" +
      '<label class="field"><span>Identificação da máquina</span><input type="text" id="sel-maquina-id" placeholder="Ex.: Mini carregadeira 01 / placa" value="' + esc(selForm.maquinaId) + '"></label>' +
      '<label class="field"><span>Empresa (opcional)</span><input type="text" id="sel-empresa" placeholder="Empresa" value="' + esc(selForm.empresa) + '"></label>' +
      '<label class="field"><span>Mês</span><input type="month" id="sel-mes" value="' + esc(selForm.mesAno) + '"></label>' +
      "</div>" +
      '<div class="btn-row">' +
      '<button type="button" class="btn btn-primary" id="btn-abrir"' + (selForm.maquinaTipo ? "" : " disabled") + ">Abrir planilha do mês</button>" +
      '<button type="button" class="btn btn-secondary" id="btn-historico"' + (selForm.maquinaTipo ? "" : " disabled") + '>Ver histórico desta máquina (todas as obras)</button>' +
      "</div>" +
      "</section>"
    );
  }

  function bindSelection() {
    document.getElementById("sel-obra").addEventListener("change", function (e) { selForm.obra = e.target.value; });
    document.getElementById("sel-maquina").addEventListener("change", function (e) {
      selForm.maquinaTipo = e.target.value;
      render();
    });
    document.getElementById("sel-maquina-id").addEventListener("input", function (e) { selForm.maquinaId = e.target.value; });
    document.getElementById("sel-empresa").addEventListener("input", function (e) { selForm.empresa = e.target.value; });
    document.getElementById("sel-mes").addEventListener("change", function (e) { selForm.mesAno = e.target.value || currentMonthISO(); });
    document.getElementById("btn-historico").addEventListener("click", function () {
      if (!selForm.maquinaTipo) return;
      historyView = { tipo: selForm.maquinaTipo, maquinaId: selForm.maquinaId };
      render();
    });
    document.getElementById("btn-abrir").addEventListener("click", openSheet);
  }

  function openSheet() {
    if (!selForm.maquinaTipo) return;
    var key = monthKey(selForm.obra, selForm.maquinaTipo, selForm.maquinaId, selForm.mesAno);
    var months = loadMonths();
    var record = months[key];
    if (!record) {
      record = newMonthRecord(selForm.obra, selForm.maquinaTipo, selForm.maquinaId, selForm.empresa, selForm.mesAno);
      persistRecord(key, record, months);
    } else if (selForm.empresa && record.empresa !== selForm.empresa) {
      record.empresa = selForm.empresa;
      persistRecord(key, record, months);
    }
    sheet = { key: key, record: record, selectedDay: isCurrentMonth(record.mesAno) ? todayDayOfMonth() : "01" };
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* =========================================================
     RENDER — PLANILHA DO MÊS (dias + preenchimento)
     ========================================================= */
  function renderSheet() {
    var record = sheet.record;
    var nDays = daysInMonth(record.mesAno);
    var chips = "";
    for (var d = 1; d <= nDays; d++) {
      var dd = pad2(d);
      var st = dayStatus(record, dd);
      var cls = "day-chip" + (dd === sheet.selectedDay ? " is-selected" : "") + (isCurrentMonth(record.mesAno) && dd === todayDayOfMonth() ? " is-today" : "");
      var dataStatus = st === "ok" ? "ok" : st === "nc" ? "nc" : st === "partial" ? "partial" : "vazio";
      chips += '<button type="button" class="' + cls + '" data-day="' + dd + '" data-status="' + dataStatus + '">' + d + '<span class="dot"></span></button>';
    }
    return (
      '<section class="card">' +
      '<div class="sheet-toolbar">' +
      '<div>' +
      '<p class="card-eyebrow">Planilha do mês</p>' +
      '<h1 class="card-title">' + esc(machineLabel(record.maquinaTipoKey)) + " — " + monthLabel(record.mesAno) + "</h1>" +
      "</div>" +
      '<div class="sheet-toolbar-actions">' +
      '<button type="button" class="btn-ghost" id="btn-historico-sheet">Ver histórico desta máquina</button>' +
      '<button type="button" class="btn-ghost" id="btn-trocar">Trocar obra/máquina/mês</button>' +
      "</div>" +
      "</div>" +
      (MACHINE_TYPES[record.maquinaTipoKey] && MACHINE_TYPES[record.maquinaTipoKey].foto ?
        '<div class="machine-photo-row">' +
        '<img src="' + MACHINE_TYPES[record.maquinaTipoKey].foto + '" alt="Foto de referência — ' + esc(machineLabel(record.maquinaTipoKey)) + '">' +
        '<div class="machine-photo-caption"><strong>' + esc(machineLabel(record.maquinaTipoKey)) + '</strong>Foto de referência do equipamento conforme cadastro</div>' +
        "</div>" : "") +
      '<div class="plate">' +
      '<div class="plate-item"><span class="plate-label">Obra</span><span class="plate-value">' + esc(record.obra) + "</span></div>" +
      '<div class="plate-item"><span class="plate-label">Máquina</span><span class="plate-value">' + esc(record.maquinaId || "—") + "</span></div>" +
      '<div class="plate-item"><span class="plate-label">Empresa</span><span class="plate-value">' + esc(record.empresa || "—") + "</span></div>" +
      "</div>" +
      '<div class="btn-row" style="margin-bottom:18px;">' +
      '<button type="button" class="btn btn-secondary" id="btn-pdf">Baixar PDF do mês</button>' +
      '<button type="button" class="btn btn-secondary" id="btn-backup">Exportar backup do mês</button>' +
      '<button type="button" class="btn btn-secondary" id="btn-import">Importar backup</button>' +
      '<input type="file" id="import-input" accept="application/json" hidden>' +
      "</div>" +
      '<div class="day-chips-wrap"><span class="day-chips-label">Selecione o dia</span><div class="day-chips" id="day-chips">' + chips + "</div></div>" +
      '<div id="day-mount"></div>' +
      renderClosingSection(record) +
      "</section>"
    );
  }

  function renderClosingSection(record) {
    var f = getFechamento(record);
    var statusHtml = (f.data ?
      '<p class="closing-status">Fechamento registrado em ' + esc(f.data) + '. Ele será incluído no PDF do mês.</p>' :
      '<p class="closing-status is-pending">Ainda não assinado — o PDF do mês sai sem esta seção até salvar aqui.</p>');
    return (
      '<div class="closing-section" id="closing-section">' +
      '<p class="card-eyebrow">Fechamento do mês</p>' +
      '<h2 class="card-title" style="font-size:17px;margin-bottom:6px;">Assinaturas de encerramento</h2>' +
      '<p class="closing-hint">Preencha ao final do mês, com o operador responsável e o Técnico de Segurança do Trabalho (TST). As assinaturas ficam salvas neste aparelho e entram automaticamente no PDF do mês.</p>' +
      '<div class="closing-grid">' +
      '<div class="closing-col">' +
      '<label class="field"><span>Nome do operador responsável</span><input type="text" id="f-fech-operador-nome" placeholder="Nome completo" value="' + esc(f.operadorNome) + '"></label>' +
      '<div class="sig-block"><span>Assinatura do operador</span><div class="sig-pad-wrap"><canvas id="sig-fech-operador"></canvas><span class="sig-hint" id="hint-fech-operador">Assine aqui</span></div><button type="button" class="btn-ghost" id="clear-sig-fech-operador">Limpar assinatura</button></div>' +
      "</div>" +
      '<div class="closing-col">' +
      '<label class="field"><span>Nome do TST responsável</span><input type="text" id="f-fech-tst-nome" placeholder="Nome completo" value="' + esc(f.tstNome) + '"></label>' +
      '<div class="sig-block"><span>Assinatura do TST</span><div class="sig-pad-wrap"><canvas id="sig-fech-tst"></canvas><span class="sig-hint" id="hint-fech-tst">Assine aqui</span></div><button type="button" class="btn-ghost" id="clear-sig-fech-tst">Limpar assinatura</button></div>' +
      "</div>" +
      "</div>" +
      '<div class="btn-row"><button type="button" class="btn btn-primary" id="btn-salvar-fechamento">Salvar fechamento do mês</button></div>' +
      statusHtml +
      "</div>"
    );
  }

  function bindSheetShell() {
    document.getElementById("btn-trocar").addEventListener("click", function () { sheet = null; render(); });
    document.getElementById("btn-historico-sheet").addEventListener("click", function () {
      var record = sheet.record;
      historyView = { tipo: record.maquinaTipoKey, maquinaId: record.maquinaId };
      render();
    });
    document.getElementById("btn-pdf").addEventListener("click", function () { offerMonthPDF(sheet.record); });
    document.getElementById("btn-backup").addEventListener("click", function () { offerBackup(sheet.record); });
    var importInput = document.getElementById("import-input");
    document.getElementById("btn-import").addEventListener("click", function () { importInput.click(); });
    importInput.addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
      importInput.value = "";
    });
    document.getElementById("day-chips").addEventListener("click", function (e) {
      var btn = e.target.closest(".day-chip");
      if (!btn) return;
      openDay(btn.getAttribute("data-day"));
    });
    bindClosingSection();
  }

  function bindClosingSection() {
    var record = sheet.record;
    var f = getFechamento(record);

    var opCanvas = document.getElementById("sig-fech-operador");
    sigCtlFechOperador = setupSignaturePad(opCanvas, document.getElementById("hint-fech-operador"));
    if (f.operadorAssinatura) sigCtlFechOperador.restore(f.operadorAssinatura);
    document.getElementById("clear-sig-fech-operador").addEventListener("click", function () { sigCtlFechOperador.clear(); });

    var tstCanvas = document.getElementById("sig-fech-tst");
    sigCtlFechTst = setupSignaturePad(tstCanvas, document.getElementById("hint-fech-tst"));
    if (f.tstAssinatura) sigCtlFechTst.restore(f.tstAssinatura);
    document.getElementById("clear-sig-fech-tst").addEventListener("click", function () { sigCtlFechTst.clear(); });

    document.getElementById("btn-salvar-fechamento").addEventListener("click", function () {
      var operadorNome = document.getElementById("f-fech-operador-nome").value.trim();
      var tstNome = document.getElementById("f-fech-tst-nome").value.trim();
      var operadorAssinatura = sigCtlFechOperador.isEmpty() ? null : opCanvas.toDataURL("image/png");
      var tstAssinatura = sigCtlFechTst.isEmpty() ? null : tstCanvas.toDataURL("image/png");

      var missing = [];
      if (!operadorNome) missing.push("nome do operador");
      if (!operadorAssinatura) missing.push("assinatura do operador");
      if (!tstNome) missing.push("nome do TST");
      if (!tstAssinatura) missing.push("assinatura do TST");
      if (missing.length) {
        toast("Faltou preencher: " + missing.join(", ") + ".", "error");
        return;
      }

      record.fechamento = {
        operadorNome: operadorNome,
        operadorAssinatura: operadorAssinatura,
        tstNome: tstNome,
        tstAssinatura: tstAssinatura,
        data: new Date().toLocaleString("pt-BR")
      };
      var months = loadMonths();
      persistRecord(sheet.key, record, months);
      toast("Fechamento do mês salvo. Ele já entra no próximo PDF gerado.");
      var mount = document.getElementById("closing-section");
      if (mount) mount.outerHTML = renderClosingSection(record);
      bindClosingSection();
    });
  }

  function openDay(dia) {
    sheet.selectedDay = dia;
    document.querySelectorAll(".day-chip").forEach(function (c) { c.classList.toggle("is-selected", c.getAttribute("data-day") === dia); });
    mountDayForm();
    var mount = document.getElementById("day-mount");
    if (mount) mount.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function mountDayForm() {
    var mount = document.getElementById("day-mount");
    if (!mount) return;
    var record = sheet.record;
    var dia = sheet.selectedDay;
    var existing = record.dias[dia];
    var draft = existing
      ? { operador: existing.operador, statuses: existing.statuses.slice(), observacao: existing.observacao || "", assinatura: existing.assinatura || null, fotos: (existing.fotos || []).slice() }
      : { operador: "", statuses: record.itens.map(function () { return null; }), observacao: "", assinatura: null, fotos: [] };

    var epiChips = EPI_LIST.map(function (e) { return '<span class="epi-chip">' + esc(e) + "</span>"; }).join("");
    var itemsHtml = record.itens.map(function (desc, idx) {
      return (
        '<div class="item-row" data-idx="' + idx + '">' +
        '<span class="item-num mono">' + (idx + 1) + "</span>" +
        '<p class="item-desc">' + esc(desc) + "</p>" +
        '<div class="status-group" role="group" aria-label="Status do item ' + (idx + 1) + '">' +
        '<button type="button" class="status-btn" data-status="ok">OK</button>' +
        '<button type="button" class="status-btn" data-status="nc">Não conf.</button>' +
        '<button type="button" class="status-btn" data-status="na">N/A</button>' +
        "</div></div>"
      );
    }).join("");

    mount.innerHTML =
      '<div class="plate">' +
      '<div class="plate-item"><span class="plate-label">Dia</span><span class="plate-value mono">' + dia + " de " + monthLabel(record.mesAno) + "</span></div>" +
      "</div>" +
      '<div class="field-grid">' +
      '<label class="field"><span>Operador (rubrica do dia)</span><input type="text" id="f-operador" placeholder="Nome do operador" value="' + esc(draft.operador) + '"></label>' +
      "</div>" +
      '<div class="epi-box"><strong>Uso obrigatório dos EPI’s:</strong> confira antes de operar.<div class="epi-chips">' + epiChips + "</div></div>" +
      '<div id="form-errors" class="form-errors" hidden></div>' +
      '<div class="items-list">' + itemsHtml + "</div>" +
      '<label class="field nc-note" id="nc-note-wrap" hidden><span>Descreva a não conformidade observada</span><textarea id="f-nc" placeholder="Descreva o que foi encontrado…">' + esc(draft.observacao) + "</textarea></label>" +
      '<div class="foto-section" id="foto-section" hidden>' +
      '<span>Foto da não conformidade (obrigatória)</span>' +
      '<div class="foto-list" id="foto-list"></div>' +
      '<button type="button" class="foto-add-btn" id="btn-add-foto">📷 Tirar/anexar foto</button>' +
      '<input type="file" id="f-foto-input" accept="image/*" capture="environment" multiple hidden>' +
      "</div>" +
      '<div class="sig-section" id="sig-section" hidden>' +
      '<div class="sig-block"><span>Assinatura do operador (obrigatória quando há não conformidade)</span><div class="sig-pad-wrap"><canvas id="sig-operador"></canvas><span class="sig-hint" id="hint-operador">Assine aqui</span></div><button type="button" class="btn-ghost" id="clear-sig">Limpar assinatura</button></div>' +
      "</div>" +
      '<div class="btn-row"><button type="button" class="btn btn-primary" id="btn-salvar-dia">Salvar dia</button></div>';

    draft.statuses.forEach(function (status, idx) {
      if (!status) return;
      var row = mount.querySelector('.item-row[data-idx="' + idx + '"]');
      if (!row) return;
      row.classList.toggle("is-nc", status === "nc");
      row.classList.toggle("is-ok", status === "ok");
      var btn = row.querySelector('.status-btn[data-status="' + status + '"]');
      if (btn) btn.classList.add("active");
    });
    updateConditionalSections(draft);

    document.getElementById("f-operador").addEventListener("input", function (e) { draft.operador = e.target.value; });
    var ncField = document.getElementById("f-nc");
    ncField.addEventListener("input", function (e) { draft.observacao = e.target.value; });

    mount.querySelector(".items-list").addEventListener("click", function (e) {
      var btn = e.target.closest(".status-btn");
      if (!btn) return;
      var row = btn.closest(".item-row");
      var idx = parseInt(row.getAttribute("data-idx"), 10);
      var status = btn.getAttribute("data-status");
      draft.statuses[idx] = status;
      row.querySelectorAll(".status-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      row.classList.toggle("is-nc", status === "nc");
      row.classList.toggle("is-ok", status === "ok");
      updateConditionalSections(draft);
    });

    var sigCanvas = document.getElementById("sig-operador");
    sigCtl = setupSignaturePad(sigCanvas, document.getElementById("hint-operador"));
    sigCtl.onChange = function (dataUrl) { draft.assinatura = dataUrl; };
    if (draft.assinatura) sigCtl.restore(draft.assinatura);
    document.getElementById("clear-sig").addEventListener("click", function () { sigCtl.clear(); });

    renderFotoList(draft);
    var fotoInput = document.getElementById("f-foto-input");
    document.getElementById("btn-add-foto").addEventListener("click", function () { fotoInput.click(); });
    fotoInput.addEventListener("change", function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      fotoInput.value = ""; // permite escolher/tirar o mesmo arquivo de novo depois
      if (!files.length) return;
      toast("Processando " + files.length + " foto(s)…");
      compressImagesSequentially(files).then(function (dataUrls) {
        var falhou = false;
        dataUrls.forEach(function (url) { if (url) draft.fotos.push(url); else falhou = true; });
        if (falhou) toast("Uma das fotos não pôde ser processada e foi ignorada.", "error");
        renderFotoList(draft);
      }).catch(function () {
        toast("Não foi possível processar uma das fotos.", "error");
      });
    });

    document.getElementById("btn-salvar-dia").addEventListener("click", function () { saveDay(draft); });
  }

  function renderFotoList(draft) {
    var list = document.getElementById("foto-list");
    if (!list) return;
    list.innerHTML = draft.fotos.map(function (url, idx) {
      return '<div class="foto-thumb" data-idx="' + idx + '"><img src="' + url + '" alt="Foto ' + (idx + 1) + ' da não conformidade"><button type="button" aria-label="Remover foto">×</button></div>';
    }).join("");
    list.querySelectorAll(".foto-thumb button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.parentNode.getAttribute("data-idx"), 10);
        draft.fotos.splice(idx, 1);
        renderFotoList(draft);
      });
    });
  }

  // Decodifica o arquivo da foto. createImageBitmap é o caminho mais robusto —
  // decodifica o Blob direto (sem passar por FileReader+data URL+<img>, uma etapa
  // a menos onde dado pode corromper) e rejeita de verdade quando a imagem não
  // pôde ser lida, em vez de "funcionar" silenciosamente com uma imagem vazia.
  // Em navegadores sem suporte, cai para o caminho antigo via <img>.
  function decodeImageFile(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file).then(function (bitmap) {
        return {
          width: bitmap.width, height: bitmap.height,
          draw: function (ctx, w, h) { ctx.drawImage(bitmap, 0, 0, w, h); if (bitmap.close) bitmap.close(); }
        };
      }).catch(function () { return decodeImageFileViaImg(file); });
    }
    return decodeImageFileViaImg(file);
  }
  function decodeImageFileViaImg(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          // Se o navegador não conseguiu decodificar a imagem (comum com fotos em
          // HEIC vindas de iPhone em alguns navegadores), o onload ainda dispara,
          // mas a imagem vem com dimensão zero.
          if (!img.naturalWidth || !img.naturalHeight) { reject(new Error("decode vazio")); return; }
          resolve({ width: img.naturalWidth, height: img.naturalHeight, draw: function (ctx, w, h) { ctx.drawImage(img, 0, 0, w, h); } });
        };
        img.onerror = function () { reject(new Error("falha ao decodificar")); };
        img.src = String(reader.result);
      };
      reader.onerror = function () { reject(new Error("falha ao ler arquivo")); };
      reader.readAsDataURL(file);
    });
  }

  // Quando várias fotos são selecionadas de uma vez da galeria (confirmado pelo
  // usuário: acontece tanto no iPhone quanto no Android, mesmo fora de apps como
  // WhatsApp), o celular às vezes ainda não baixou o arquivo original da foto —
  // comum quando a galeria guarda só uma cópia reduzida localmente e otimiza o
  // espaço (iCloud/Google Fotos), baixando o original sob demanda. Nesse caso o
  // navegador entrega, por enquanto, uma prévia minúscula no lugar da foto real,
  // o que gera exatamente esse efeito de "bloco de cor sólida" ao ser esticada
  // para o tamanho do checklist. Detectamos isso pela dimensão decodificada ser
  // pequena demais para uma foto de câmera e tentamos de novo, dando mais tempo
  // a cada tentativa para o aparelho terminar de baixar/preparar o arquivo.
  function decodeImageFileWithRetry(file, attempt) {
    attempt = attempt || 0;
    return decodeImageFile(file).then(function (decoded) {
      var looksLikePlaceholder = Math.max(decoded.width, decoded.height) < 500;
      if (looksLikePlaceholder && attempt < 4) {
        return wait(700 * (attempt + 1)).then(function () { return decodeImageFileWithRetry(file, attempt + 1); });
      }
      return decoded;
    });
  }

  // Comprime a foto no próprio aparelho antes de guardar (fotos de câmera podem ter
  // vários MB — sem isso, algumas fotos já estourariam o limite de armazenamento local).
  function compressImageFile(file, maxDim, quality) {
    maxDim = maxDim || 1024;
    quality = quality || 0.68;
    return decodeImageFileWithRetry(file).then(function (decoded) {
      var scale = Math.min(1, maxDim / Math.max(decoded.width, decoded.height));
      var w = Math.max(1, Math.round(decoded.width * scale));
      var h = Math.max(1, Math.round(decoded.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      // Fundo branco antes de desenhar: cobre tanto uma eventual área transparente
      // da imagem original quanto o caso de o desenho falhar silenciosamente —
      // nos dois casos o resultado fica branco, nunca preto.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      decoded.draw(ctx, w, h);
      try { return canvas.toDataURL("image/jpeg", quality); }
      catch (e) { return null; }
    }).catch(function () { return null; });
  }

  // Processa as fotos selecionadas uma de cada vez, em vez de Promise.all (todas
  // ao mesmo tempo): decodificar várias fotos de câmera em paralelo via canvas
  // é instável em vários navegadores/WebViews de celular — a primeira foto sai
  // certa e as seguintes saem corrompidas (cor sólida/borrada), porque a decodificação
  // e o desenho no canvas disputam o mesmo pipeline. Uma pequena pausa entre cada
  // foto também dá tempo do aparelho terminar qualquer conversão (ex.: HEIC do
  // iPhone para JPEG) antes de ler a próxima, que é outra fonte conhecida de
  // corrupção quando várias fotos são selecionadas de uma vez.
  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  function compressImagesSequentially(files) {
    var results = [];
    return files.reduce(function (chain, file, idx) {
      return chain.then(function () {
        return (idx > 0 ? wait(150) : Promise.resolve()).then(function () {
          return compressImageFile(file).then(function (url) { results.push(url); });
        });
      });
    }, Promise.resolve()).then(function () { return results; });
  }

  function updateConditionalSections(draft) {
    var hasNC = draft.statuses.some(function (s) { return s === "nc"; });
    var ncWrap = document.getElementById("nc-note-wrap");
    var fotoWrap = document.getElementById("foto-section");
    var sigWrap = document.getElementById("sig-section");
    var wasHidden = sigWrap && sigWrap.hidden;
    if (ncWrap) ncWrap.hidden = !hasNC;
    if (fotoWrap) fotoWrap.hidden = !hasNC;
    if (sigWrap) sigWrap.hidden = !hasNC;
    // o campo de assinatura estava escondido (display:none) e acabou de aparecer:
    // sem isso, o canvas fica com resolução interna zerada e a assinatura não é
    // capturada corretamente (traço invisível/desalinhado).
    if (sigWrap && wasHidden && !sigWrap.hidden && sigCtl && typeof sigCtl.resize === "function") {
      sigCtl.resize();
    }
  }

  function validateDay(draft) {
    var errors = [];
    if (!draft.operador || !draft.operador.trim()) errors.push("Informe o nome do operador.");
    var unanswered = draft.statuses.filter(function (s) { return !s; }).length;
    if (unanswered > 0) errors.push(unanswered + " item(ns) do checklist ainda não foram marcados (OK / Não conf. / N/A).");
    var hasNC = draft.statuses.some(function (s) { return s === "nc"; });
    if (hasNC && (!draft.observacao || !draft.observacao.trim())) errors.push("Descreva a não conformidade observada.");
    if (hasNC && (!draft.fotos || draft.fotos.length === 0)) errors.push("Anexe ao menos uma foto como prova da não conformidade.");
    if (hasNC && !draft.assinatura) errors.push("Colete a assinatura do operador — obrigatória quando há não conformidade.");
    return errors;
  }

  function saveDay(draft) {
    var errors = validateDay(draft);
    var errBox = document.getElementById("form-errors");
    if (errors.length) {
      errBox.hidden = false;
      errBox.innerHTML = "<strong>Corrija antes de continuar:</strong><ul>" + errors.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul>";
      errBox.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    errBox.hidden = true;

    var record = sheet.record;
    var hasNC = draft.statuses.some(function (s) { return s === "nc"; });
    record.dias[sheet.selectedDay] = {
      operador: draft.operador,
      statuses: draft.statuses.slice(),
      observacao: hasNC ? draft.observacao : "",
      fotos: hasNC ? draft.fotos.slice() : [],
      assinatura: hasNC ? draft.assinatura : null,
      atualizadoEm: new Date().toISOString()
    };
    var months = loadMonths();
    persistRecord(sheet.key, record, months);
    toast("Dia " + sheet.selectedDay + " salvo.");
    render();
  }

  /* =========================================================
     INICIALIZAÇÃO
     ========================================================= */
  render();
  initCapabilities();
  checkStorageHealth();
  syncOnStartup();
  bindTabBar();
  syncAlojChecklistsOnStartup();
})();
</script>
</body>
